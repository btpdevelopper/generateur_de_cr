        // 1. SI LE MOIS EST FIGÉ (Certificat Généré), ON PREND LE SNAPSHOT
        if (data.frozenData) {
            remboursementMois = data.frozenData.montantRemboursementMoisHT;
            // On peut aussi figer les pénalités pour être sûr à 100%
            penalitesMois = data.frozenData.penalitesDuMoisHT;
        } 
        // 2. SINON : CALCUL DYNAMIQUE (Mode Projection)
        else if (lot.avance) {
            const avancement = nouveauMontantMarche > 0 ? (cumulValideMOE / nouveauMontantMarche) * 100 : 0;
            let startConditionMet = false;
            if (lot.avance.typeDebutRemboursement === 'mois') {
                startConditionMet = mois >= lot.avance.valeurDebutRemboursement;
            } else {
                startConditionMet = avancement >= lot.avance.valeurDebutRemboursement;
            }

            if (startConditionMet) {
                const maxRemboursement = lot.avance.montantCalculeHT - cumulRemboursementAvance;
                const calc = valideMoisHT * lot.avance.tauxRemboursement;
                remboursementMois = Math.max(0, Math.min(maxRemboursement, calc));
            }
        }
        
        cumulRemboursementAvance += remboursementMois;
        // -------------------------------------------------------

        const netValideMoisHT = valideMoisHT - remboursementMois + penalitesMois;
        const isDisabled = data.validationStatut === 'Certificat Généré';
        const disabledClasses = isDisabled ? 'bg-gray-100 text-gray-500 cursor-not-allowed' : 'bg-white';

        // Badge Alerte (NOUVEAU DESIGN)
        const alertInfo = getFinancialAlertStatus(mois, data.situationDate, data.validationDate, data.validationStatut);
        let alertHtml = '';

        if (alertInfo.type === 'ok') {
            alertHtml = `<span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-md text-xs font-medium bg-green-100 text-green-700 border border-green-200 w-full">
                            <i data-lucide="check-circle-2" class="h-3.5 w-3.5 flex-shrink-0"></i> OK
                         </span>`;
        } else if (alertInfo.type === 'future') {
            alertHtml = `<span class="inline-flex items-center justify-center px-2.5 py-1 rounded-md text-xs font-medium bg-gray-50 text-gray-400 border border-gray-200 w-full opacity-60">
                            À venir
                         </span>`;
        } else {
            // Gestion des couleurs selon l'urgence
            let badgeStyle = 'bg-blue-50 text-blue-700 border-blue-200'; // Défaut
            
            if (alertInfo.type === 'missing' || alertInfo.type === 'late_submission' || alertInfo.type === 'late_validation') {
                badgeStyle = 'bg-red-50 text-red-700 border-red-200';
            } else if (alertInfo.type === 'wait' || alertInfo.type === 'pending_validation' || alertInfo.type === 'expecting') {
                badgeStyle = 'bg-amber-50 text-amber-700 border-amber-200';
            }

            alertHtml = `<span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-md text-xs font-medium border ${badgeStyle} w-full" title="${alertInfo.label}">
                            <i data-lucide="${alertInfo.icon}" class="h-3.5 w-3.5 flex-shrink-0"></i> 
                            <span class="truncate">${alertInfo.label}</span>
                         </span>`;
        }

        tableHtml += `
            <tr class="financial-row hover:bg-gray-50 transition-colors group" data-month="${mois}" data-remb-calcule="${remboursementMois}">
                <td class="px-2 py-2 font-semibold text-gray-700 sticky left-0 bg-white group-hover:bg-gray-50 border-r">
                    ${new Date(mois + '-02').toLocaleString('fr-FR', { month: 'short', year: '2-digit' }).toUpperCase()}
                </td>
                <td class="px-2 py-2">${alertHtml}</td>
                <td class="px-2 py-2"><input type="text" ${isDisabled ? 'disabled' : ''} class="previsionnel-input fin-input w-full p-1.5 border rounded text-right ${disabledClasses}" value="${(data.previsionnel || '').toString().replace('.', ',')}" data-field="previsionnel"></td>
                <td class="px-2 py-2"><input type="text" ${isDisabled ? 'disabled' : ''} class="fin-input w-full p-1.5 border rounded ${disabledClasses}" value="${data.situationNumero || ''}" data-field="situationNumero"></td>
                <td class="px-2 py-2 bg-blue-50/10"><input type="date" ${isDisabled ? 'disabled' : ''} class="fin-input w-full p-1.5 border rounded text-xs ${disabledClasses}" value="${data.situationDate || ''}" data-field="situationDate"></td>
                <td class="px-2 py-2"><input type="text" ${isDisabled ? 'disabled' : ''} class="situation-montant-input fin-input w-full p-1.5 border rounded text-right ${disabledClasses}" value="${(data.situationMontantHT || '').toString().replace('.', ',')}" data-field="situationMontantHT"></td>
                <td class="px-2 py-2">
                    <select class="validation-statut-select fin-input w-full p-1.5 border rounded font-bold ${getStatutClass(data.validationStatut)} ${disabledClasses}" data-field="validationStatut" ${isDisabled ? 'disabled' : ''}>
                        ${statutOptions.map(opt => `<option value="${opt.value}" ${data.validationStatut === opt.value ? 'selected' : ''}>${opt.text}</option>`).join('')}
                    </select>
                </td>
                <td class="px-2 py-2"><input type="text" ${isDisabled ? 'disabled' : ''} class="validation-montant-input fin-input w-full p-1.5 border rounded text-right font-bold text-indigo-700 ${disabledClasses}" value="${(valideMoisHT || '').toString().replace('.', ',')}" data-field="validationMontantHT"></td>
                
                <td class="px-2 py-2 font-medium text-blue-600 text-right text-xs">${remboursementMois > 0 ? '-' + formatCurrency(remboursementMois) : '-'}</td>
                <td class="px-2 py-2 font-medium text-red-600 text-right text-xs">${formatCurrency(penalitesMois)}</td>
                <td class="px-2 py-2 font-bold text-gray-900 text-right bg-gray-50/50">${formatCurrency(netValideMoisHT)}</td>
                <td class="px-2 py-2 font-bold text-gray-500 text-right text-xs">${formatCurrency(cumulValideMOE)}</td>
            </tr>
        `;
    });
    
    tableHtml += `</tbody></table>`;
    document.getElementById('financial-table-container').innerHTML = tableHtml;
    lucide.createIcons();
    
    // --- LISTENERS MIS À JOUR ---
    const tableBody = document.getElementById('financial-table-container').querySelector('tbody');
    if (tableBody) {
        tableBody.addEventListener('change', (e) => {
             const input = e.target.closest('.fin-input');
             if (!input) return;
             const row = input.closest('tr.financial-row');
             const month = row.dataset.month;
             const field = input.dataset.field;
             const lotToUpdate = lots.find(l => l.id === lotId);
             const monthData = lotToUpdate.suiviFinancier.find(item => item.mois === month);
             
             // Gestion valeurs
             let value = input.value;
             if (['previsionnel', 'situationMontantHT', 'validationMontantHT'].includes(field)) {
                value = safeParseFloat(value);
             }

             if (monthData) {
                monthData[field] = value;

                // --- LOGIQUE DE FIGEAGE DE L'AVANCE ---
                // Si on valide le montant MOE, on fige le calcul de l'avance affiché dans la ligne
                if (field === 'validationStatut' && (value === 'Validé MOE' || value === 'Certificat Généré')) {
                    if (!monthData.validationMontantHT) monthData.validationMontantHT = monthData.situationMontantHT || 0;
                    if (!monthData.validationDate) monthData.validationDate = new Date().toISOString().split('T')[0];
                    
                    // On récupère la valeur calculée affichée dans le DOM (attribut data)
                    const computedAdvance = parseFloat(row.dataset.rembCalcule) || 0;
                    // On l'enregistre en dur dans la base
                    monthData.frozenAdvance = computedAdvance;
                }
                // Si on repasse en brouillon, on peut défiger pour permettre le recalcul si besoin
                if (field === 'validationStatut' && (value === 'Attente MOE' || value === 'Demande Correction')) {
                    delete monthData.frozenAdvance;
                }
                // --- FIN LOGIQUE ---

                saveLot(lotToUpdate).then(() => { // Utilisation de la nouvelle fonction saveLot
                    updateChartsAndTotalsFromTable();
                    renderFinancialTable(lotId); 
                });
             }
        });
    }
};

const processForecastData = () => {
    const timeline = {};
    let totalConfirmed = 0;
    let totalProjected = 0;
    let totalBillingForecast = 0;

    // 1. Calcul du Marché de Base Global
    const baseMarketTotal = lots.filter(l => !l.isArchived).reduce((sum, l) => sum + (l.montantMarche || 0), 0);

    // --- A. TRAITEMENT DES FTMs ---
    // On trie par date de création/statut pour l'ordre de traitement, 
    // mais l'affichage dépendra de la dateRef calculée ci-dessous.
    const sortedFtms = [...ftms].sort((a, b) => new Date(a.statusDate || a.date) - new Date(b.statusDate || b.date));

    sortedFtms.forEach(ftm => {
        if (ftm.status === 'Annulé') return;

        // =========================================================
        // === NOUVELLE LOGIQUE DE PRIORITÉ DES DATES ===
        // Ordre : Date Effective > Date Prévisionnelle > Date Statut
        // =========================================================
        let dateRef = null;

        if (ftm.realisationDate) {
            // 1. Priorité absolue : Date effective de réalisation
            dateRef = ftm.realisationDate;
        } else if (ftm.forecastDate) {
            // 2. Priorité secondaire : Date prévisionnelle de fin
            dateRef = ftm.forecastDate;
        } else {
            // 3. Fallback : Date de validation ou de statut actuel
            // Cela permet d'afficher la FTM même si aucune planification n'est faite
            dateRef = ftm.moaValidationDate || ftm.moeValidationDate || ftm.statusDate || new Date().toISOString().split('T')[0];
        }
        // =========================================================

        const monthKey = dateRef.substring(0, 7); // Format YYYY-MM

        if (!timeline[monthKey]) {
            timeline[monthKey] = { month: monthKey, confirmed: [], projected: [], billingForecast: [], totalMonthMarketImpact: 0, totalMonthBilling: 0 };
        }

        // Détermination du statut Financier (Validé vs Projeté)
        // Note : On garde la logique financière existante (si devis validé => Confirmed, sinon => Projected)
        const isValidated = ftm.status === 'Devis validé MOA' || ftm.status === 'Devis validé MOE' || ftm.status === 'Devis validé entreprise après analyse MOE';
        
        if (isValidated) {
            const latestQuotes = getLatestQuotes(ftm.quotes);
            const winningQuotes = latestQuotes.filter(q => q.isRejected !== true);
            const amount = winningQuotes.reduce((sum, q) => sum + (q.validatedMoaAmount ?? q.validatedAmount ?? q.amount ?? 0), 0);
            
            timeline[monthKey].confirmed.push({ ftm, amount });
            totalConfirmed += amount;
            timeline[monthKey].totalMonthMarketImpact += amount;

        } else {
            const moeEst = ftm.moeEstimate || 0;
            const latestQuotes = getLatestQuotes(ftm.quotes);
            let probableTotalAmount = 0;
            
            if (latestQuotes.length > 0) {
                const groups = {};
                latestQuotes.forEach(q => {
                    const key = q.competesWithLot || q.workPackage || q.externalCompany;
                    if(!groups[key]) groups[key] = [];
                    groups[key].push(q.amount);
                });
                Object.values(groups).forEach(amounts => {
                    probableTotalAmount += amounts.reduce((a, b) => a + b, 0) / amounts.length;
                });
                
                timeline[monthKey].projected.push({ ftm, amount: probableTotalAmount, moeEstimate: moeEst, quotes: latestQuotes });
            } else {
                probableTotalAmount = moeEst;
                timeline[monthKey].projected.push({ ftm, amount: moeEst, moeEstimate: moeEst, quotes: [] });
            }
            
            totalProjected += probableTotalAmount;
            timeline[monthKey].totalMonthMarketImpact += probableTotalAmount;
        }
    });

    // --- B. TRAITEMENT DES PRÉVISIONS DE FACTURATION (Reste inchangé) ---
    const todayMonthKey = new Date().toISOString().substring(0, 7);

    lots.forEach(lot => {
        if (lot.isArchived || !lot.suiviFinancier) return;
        lot.suiviFinancier.forEach(monthData => {
            if (monthData.mois >= todayMonthKey && monthData.previsionnel > 0) {
                const monthKey = monthData.mois;
                if (!timeline[monthKey]) {
                    timeline[monthKey] = { month: monthKey, confirmed: [], projected: [], billingForecast: [], totalMonthMarketImpact: 0, totalMonthBilling: 0 };
                }
                timeline[monthKey].billingForecast.push({
                    lotNumber: lot.number,
                    company: lot.company,
                    amount: monthData.previsionnel
                });
                timeline[monthKey].totalMonthBilling += monthData.previsionnel;
                totalBillingForecast += monthData.previsionnel;
            }
        });
    });

    // 4. Cumuls & Finalisation
    const sortedKeys = Object.keys(timeline).sort();
    let runningFtmTotal = 0;

    const timelineData = sortedKeys.map(key => {
        const monthData = timeline[key];
        runningFtmTotal += monthData.totalMonthMarketImpact;
        
        return {
            ...monthData,
            cumulativeFtmTotal: runningFtmTotal,
            projectedMarketTotal: baseMarketTotal + runningFtmTotal
        };
    });
    
    return { timelineData, baseMarketTotal, totalConfirmed, totalProjected, totalBillingForecast, grandTotalMarket: totalConfirmed + totalProjected };
};

const renderCumulativeProgressChart = (monthlyData, totalBudget) => {
    const ctx = document.getElementById('cumulative-progress-chart')?.getContext('2d');
    if (!ctx) return;

    const sortedMonths = Object.keys(monthlyData).sort();
    const labels = sortedMonths.map(m => new Date(m + '-02').toLocaleString('fr-FR', { month: 'short', year: '2-digit' }));
    
    let cumulPrevisionnel = 0;
    // --- MODIFIÉ : On calcule le cumul des montants VALIDÉS ---
    let cumulValidation = 0;
    const cumulPrevisionnelData = sortedMonths.map(m => cumulPrevisionnel += monthlyData[m].previsionnel);
    const cumulValidationData = sortedMonths.map(m => cumulValidation += (monthlyData[m].validationMontantHT || 0));

    const chart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: labels,
            datasets: [
                {
                    label: 'Objectif (Marché Total)',
                    data: Array(labels.length).fill(totalBudget),
                    borderColor: 'rgba(239, 68, 68, 0.8)', // red-500
                    borderWidth: 2,
                    borderDash: [5, 5],
                    pointRadius: 0,
                    fill: false,
                },
                {
                    label: 'Cumul Prévisionnel',
                    data: cumulPrevisionnelData,
                    borderColor: 'rgba(99, 102, 241, 0.7)', // indigo-500
                    borderWidth: 2,
                    fill: false,
                    tension: 0.1,
                },
                {
                    // --- MODIFIÉ : Le libellé et les données sont mis à jour ---
                    label: 'Cumul Validé MOE HT', 
                    data: cumulValidationData, 
                    borderColor: 'rgba(16, 185, 129, 1)', // green-500
                    backgroundColor: 'rgba(110, 231, 183, 0.2)', // green-200
                    borderWidth: 3,
                    fill: 'start',
                    tension: 0.1,
                }
            ]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                title: { display: true, text: 'Progression Cumulative vs. Objectif' },
                tooltip: { callbacks: { label: (c) => `${c.dataset.label}: ${c.raw.toLocaleString('fr-FR')} €` } }
            },
            scales: { y: { beginAtZero: true, ticks: { callback: (v) => `${(v/1000)}k €` } } }
        }
    });
    financialCharts.push(chart);
};

            const baseFtmNumber = originalFtm.ftmNumber.split('-')[0];
            const existingIndices = ftms
                .filter(f => f.ftmNumber.startsWith(baseFtmNumber))
                .map(f => {
                    const parts = f.ftmNumber.split('-');
                    return parts.length > 1 ? parts[parts.length - 1] : 'A'; // L'original est considéré comme 'A'
                })
                .sort();
            
            const lastIndex = existingIndices[existingIndices.length - 1];
            const nextIndex = String.fromCharCode(lastIndex.charCodeAt(0) + 1);
            const newFtmNumber = `${baseFtmNumber}-${nextIndex}`;

            // 2. Confirmation utilisateur
            if (!confirm(`Vous allez créer une nouvelle FTM "${newFtmNumber}".\nL'ancienne FTM "${originalFtm.ftmNumber}" sera automatiquement passée au statut "Annulé".\n\nVoulez-vous continuer ?`)) {

// CORRECTION : Sécurisation de filesHtml et des boucles
const renderDetailsModalContent = (ftm) => {
    const getLot = (lotNumber) => lots.find(l => l.number === lotNumber) || {};
    
    // --- Première fonction d'aide : pour les fichiers ---
    const filesHtml = () => {
        const allFiles = [];
        if (ftm.fpmFileUrl || ftm.fpmFilePath) allFiles.push({ type: 'FPM', url: ftm.fpmFileUrl, path: ftm.fpmFilePath, urlType: ftm.fpmFileUrlType, name: `Fichier FPM (${ftm.fpmNumber})` });
        if (ftm.ftmFileUrl || ftm.ftmFilePath) allFiles.push({ type: 'FTM', url: ftm.ftmFileUrl, path: ftm.ftmFilePath, urlType: ftm.ftmFileUrlType, name: `Fichier FTM (${ftm.ftmNumber})` });
        
        // CORRECTION CRITIQUE : Ajout de (ftm.os || []) pour éviter le crash sur undefined
        (ftm.os || []).forEach(os => { 
            if (os.osFileUrl) allFiles.push({ type: 'OS', url: os.osFileUrl, path: '', urlType: 'onedrive', name: `Fichier OS (${os.number || 'N/A'})` }); 
        });
        
        (ftm.quotes || []).forEach(q => { 
            if (q.fileUrl || q.filePath) {
                let quoteIdentifier = '';
                if (q.workPackage) {
                    quoteIdentifier = `Lot ${q.workPackage}`;
                } else if (q.externalCompany) {
                    quoteIdentifier = `Intervenant : ${q.externalCompany}`;
                } else {
                    quoteIdentifier = "Non assigné";
                }

                allFiles.push({ 
                    type: 'Devis', 
                    url: q.fileUrl, 
                    path: q.filePath, 
                    urlType: q.fileUrlType, 
                    name: `Devis ${q.number || `Ind. ${q.quoteIndex}`} - ${quoteIdentifier}`
                }); 
            }
        });

        if (allFiles.length === 0) return '<p class="text-gray-500 italic text-sm">Aucun fichier lié.</p>';
        return allFiles.map(file => {
            const isOneDrive = file.urlType === 'onedrive';
            const icon = isOneDrive ? 'cloud' : 'folder';
            const link = isOneDrive ? file.url : `file:///${(file.path || '').replace(/\\/g, '/')}`;
            const target = isOneDrive ? 'target="_blank" rel="noopener noreferrer"' : '';
            return `<a href="${link}" ${target} class="block bg-gray-100 p-2 rounded-md flex items-center gap-x-3 hover:bg-indigo-50 hover:border-indigo-200 border border-transparent transition-colors cursor-pointer"><i data-lucide="${icon}" class="text-gray-500 h-5 w-5 flex-shrink-0"></i><span class="flex-grow truncate text-sm text-gray-800">${file.name}</span><span class="text-xs text-gray-500 ml-auto flex-shrink-0">(${file.type})</span>${isOneDrive ? '<i data-lucide="arrow-up-right" class="h-4 w-4 text-gray-400 flex-shrink-0"></i>' : ''}</a>`;
        }).join('');
    };

    // --- Logique de groupement des devis ---
    const quotesHtml = () => {
        if (!ftm.quotes || ftm.quotes.length === 0) {
            return '<p class="text-gray-500 italic text-sm">Aucun devis enregistré.</p>';
        }

        // 1. Group by competition key
        const competitionGroups = (ftm.quotes || []).reduce((acc, quote) => {
            const groupKey = quote.competesWithLot || quote.workPackage || (quote.externalCompany || `ext-${quote.id}`);
            if (!acc[groupKey]) {
                acc[groupKey] = {
                    key: groupKey,
                    quotes: [],
                    primaryLot: quote.workPackage ? getLot(quote.workPackage) : (quote.competesWithLot ? getLot(quote.competesWithLot) : null)
                };
            }
            acc[groupKey].quotes.push(quote);
            if (!acc[groupKey].primaryLot && quote.workPackage) {
                acc[groupKey].primaryLot = getLot(quote.workPackage);
            }
            return acc;
        }, {});

        // 2. Iterate over these visual groups
        return Object.values(competitionGroups).map(group => {
            // 3. Find bidders in group
            const biddersInGroup = group.quotes.reduce((acc, q) => {
                const bidderKey = (q.workPackage ? (getLot(q.workPackage)?.company || q.workPackage) : q.externalCompany) || 'unknown';
                if (!acc[bidderKey] || q.quoteIndex > acc[bidderKey].quoteIndex) {
                    acc[bidderKey] = q;
                }
                return acc;
            }, {});
            const isCompetition = Object.values(biddersInGroup).length > 1;

            // 4. Group quotes by company within the competition group
            const quotesByCompanyInGroup = group.quotes.reduce((acc, quote) => {
                const companyKey = (quote.workPackage ? (getLot(quote.workPackage)?.company || q.workPackage) : quote.externalCompany) || 'unknown';
                if (!acc[companyKey]) {
                    acc[companyKey] = {
                        quotes: [],
                        isExternal: !!quote.externalCompany,
                        workPackage: quote.workPackage,
                        externalCompany: quote.externalCompany
                    };
                }
                acc[companyKey].quotes.push(quote);
                return acc;
            }, {});

            // 5. Create the HTML
            if (isCompetition) {
                const lot = group.primaryLot || getLot(group.key);
                const groupTitle = `Concurrence pour Lot ${lot.number} - ${lot.name}`;
                
                const competitorCardsHtml = Object.values(quotesByCompanyInGroup).map(companyGroup => {
                    const quotesHtml = companyGroup.quotes
                        .sort((a, b) => a.quoteIndex.localeCompare(b.quoteIndex))
                        .map(q => renderQuoteCard(ftm, q, q.quoteIndex !== companyGroup.quotes.reduce((latest, current) => (current.quoteIndex > latest) ? current.quoteIndex : latest, 'A')))
                        .join('');

                    let cardTitle = '';
                    let cardIcon = 'building-2';
                    if (companyGroup.workPackage) {
                        cardTitle = getLot(companyGroup.workPackage)?.company || 'Entreprise';
                    } else if (companyGroup.externalCompany) {
                        cardTitle = `Intervenant : ${companyGroup.externalCompany}`;
                        cardIcon = 'user';
                    }

                    return `
                        <div class="border rounded-lg bg-white p-3 shadow-sm">
                            <h5 class="font-semibold text-gray-700 flex items-center mb-2 text-sm">
                                <i data-lucide="${cardIcon}" class="h-4 w-4 mr-2 text-gray-500"></i>
                                ${cardTitle}
                            </h5>
                            <div class="space-y-3">${quotesHtml}</div>
                        </div>
                    `;
                }).join('');

                return `
                    <div class="border-2 rounded-xl p-3 border-indigo-200 bg-indigo-50/20 space-y-3">
                        <h4 class="font-bold text-indigo-700 flex items-center mb-2">
                            <i data-lucide="briefcase" class="h-4 w-4 mr-2"></i>
                            ${groupTitle}
                        </h4>
                        ${competitorCardsHtml}
                    </div>
                `;
            } else {
                const lot = group.primaryLot || getLot(group.key);
                let groupTitle = '';
                let groupIcon = 'building-2';

                if (lot && lot.number) {
                    groupTitle = `${lot.number} - ${lot.name} (${lot.company})`;
                } else if (group.quotes.length > 0 && group.quotes[0].externalCompany) {
                    groupTitle = `Intervenant : ${group.quotes[0].externalCompany}`;
                    groupIcon = 'user';
                } else {
                    groupTitle = "Groupe non identifié";
                }

                const quotesHtml = group.quotes
                    .sort((a, b) => a.quoteIndex.localeCompare(b.quoteIndex))
                    .map(q => renderQuoteCard(ftm, q, q.quoteIndex !== group.quotes.reduce((latest, current) => (current.quoteIndex > latest) ? current.quoteIndex : latest, 'A')))
                    .join('<hr class="my-4 border-dashed">'); 

                return `
                    <div class="border-2 rounded-xl p-3 border-transparent">
                        <h4 class="font-semibold text-gray-700 flex items-center mb-2">
                            <i data-lucide="${groupIcon}" class="h-4 w-4 mr-2 text-gray-500"></i>
                            ${groupTitle}
                        </h4>
                        <div class="space-y-3">${quotesHtml}</div>
                    </div>
                `;
            }
        }).join('');

// VERSION FINALE ROBUSTE : renderQuoteCard
const renderQuoteCard = (ftm, quote, isOutdated) => { 
    const getLot = (lotNumber) => lots.find(l => l.number === lotNumber) || {};
    const formatCurrency = (amount) => new Intl.NumberFormat('fr-FR', { style: 'currency', currency: 'EUR' }).format(amount);
    
    // Helper d'affichage : Transforme null/undefined en chaîne vide, mais garde "0"
    const safeVal = (v) => (v !== null && v !== undefined) ? v : '';

    // --- 1. Affichage de l'Entité ---
    let entityDisplayHtml = '';
    if (quote.workPackage) {
        const lot = getLot(quote.workPackage);
        entityDisplayHtml = (lot && lot.number) 
            ? `<div class="flex flex-col"><span class="text-xs font-bold text-indigo-700 uppercase tracking-wide flex items-center gap-1"><i data-lucide="building-2" class="h-3 w-3"></i> Lot ${lot.number}</span><span class="text-gray-700 font-semibold text-sm">${lot.company}</span></div>`
            : (quote.externalCompany ? `<div class="flex flex-col"><span class="text-xs font-bold text-amber-700 uppercase tracking-wide flex items-center gap-1"><i data-lucide="briefcase" class="h-3 w-3"></i> Prestataire</span><span class="text-gray-700 font-semibold text-sm">${quote.externalCompany}</span></div>` : `<span class="text-red-600 font-bold text-sm">Inconnu</span>`);
    } else {
        entityDisplayHtml = `<span class="text-red-500 font-bold text-sm">Non assigné</span>`;
    }

    // --- 2. États ---
    const isAcceptedClass = quote.isAccepted ? 'border-purple-400 bg-purple-50/50 ring-1 ring-purple-400' : 'border-gray-200';
    const outdatedClass = isOutdated ? 'opacity-60 grayscale-[30%] bg-gray-50' : 'bg-white';
    const isLoser = quote.isRejected === true;
    const isWinner = quote.isRejected === false;
    const competitionOpen = quote.isRejected === undefined;

    // --- 3. Concurrence ---
    const groupKey = quote.competesWithLot || quote.workPackage || (quote.externalCompany || `ext-${quote.id}`);
    const quotesInSameGroup = (ftm.quotes || []).filter(q => {
        const qKey = q.competesWithLot || q.workPackage || (q.externalCompany || `ext-${q.id}`);
        return qKey === groupKey;
    });
    const biddersInGroup = quotesInSameGroup.reduce((acc, q) => {
        const lot = getLot(q.workPackage);
        const bidderKey = (lot.id) ? lot.id : (q.externalCompany || 'unknown');
        if (!acc[bidderKey] || q.quoteIndex > acc[bidderKey].quoteIndex) acc[bidderKey] = q;
        return acc;
    }, {});
    const competitionExists = Object.keys(biddersInGroup).length > 1;

    // --- 4. Vérification stricte pour l'état initial (0 est valide) ---
    // Un champ est rempli s'il n'est ni null, ni chaine vide.
    const hasAmount = (quote.validatedAmount !== null && quote.validatedAmount !== '');
    const hasDelay = (quote.validatedMoeDelay !== null && quote.validatedMoeDelay !== '');
    const isMoeFilled = hasAmount && hasDelay;
    
    const moaDisabled = !isMoeFilled ? 'disabled' : '';
    const moaOpacity = !isMoeFilled ? 'opacity-50' : '';

    // --- 5. HTML ---
    let negotiationHtml = '';

    if (isOutdated) {
        negotiationHtml = '<div class="text-center text-xs text-gray-400 pt-2 mt-2 border-t border-dashed">Indice remplacé</div>';
    } else if (ftm.status === 'Annulé') {
        negotiationHtml = '<div class="text-center text-xs text-red-400 pt-2 mt-2 border-t border-dashed font-medium">FTM Annulée</div>';
    } else if (isLoser) {
        negotiationHtml = `
            <div class="mt-3 pt-3 border-t border-dashed flex justify-between items-center bg-red-50/50 -mx-3 px-3 pb-1 rounded-b-lg">
                <span class="text-xs font-bold text-red-600 flex items-center gap-1"><i data-lucide="x-circle" class="h-3 w-3"></i> Non retenu</span>
                ${competitionExists ? `<button type="button" class="reactivate-offer-btn text-xs text-indigo-600 hover:text-indigo-800 hover:underline font-medium" data-ftm-id="${ftm.id}" data-quote-id="${quote.id}">Rétablir</button>` : ''}
            </div>`;
    } else if (isWinner || (!competitionExists && competitionOpen)) {
        negotiationHtml = `
            <div class="mt-3 pt-3 border-t border-gray-100 space-y-3 quote-negotiation-block" data-quote-id="${quote.id}">
                ${competitionExists ? `<div class="flex justify-between items-center mb-2"><span class="text-xs font-bold text-green-600 flex items-center gap-1 bg-green-50 px-2 py-1 rounded-full"><i data-lucide="check-circle-2" class="h-3 w-3"></i> Sélectionné</span><button type="button" class="unselect-for-moe-btn text-xs text-gray-400 hover:text-red-600 hover:underline" data-ftm-id="${ftm.id}" data-quote-id="${quote.id}">Annuler choix</button></div>` : ''}
                
                <div class="space-y-1.5">
                    <div class="flex items-center justify-between"><label class="text-[10px] uppercase font-bold text-gray-500">Validation MOE</label><button type="button" class="copy-ese-to-moe-btn text-xs text-indigo-600 hover:bg-indigo-50 p-1 rounded" data-quote-id="${quote.id}"><i data-lucide="copy" class="h-3 w-3 inline"></i> Copier</button></div>
                    <div class="grid grid-cols-2 gap-x-2">
                        <div class="relative">
                            <input type="number" step="0.01" id="validatedAmount-${quote.id}" data-quote-id="${quote.id}" value="${safeVal(quote.validatedAmount)}" class="negotiation-input w-full pl-2 pr-6 py-1.5 text-sm bg-gray-50 border border-gray-300 rounded-md focus:ring-1 focus:ring-indigo-500" placeholder="0.00" data-field="validatedAmount">
                            <span class="absolute right-2 top-1.5 text-xs text-gray-400">€</span>
                        </div>
                        <div class="relative">
                            <input type="number" id="validatedMoeDelay-${quote.id}" data-quote-id="${quote.id}" value="${safeVal(quote.validatedMoeDelay)}" class="negotiation-input w-full pl-2 pr-6 py-1.5 text-sm bg-gray-50 border border-gray-300 rounded-md focus:ring-1 focus:ring-indigo-500" placeholder="0" data-field="validatedMoeDelay">
                            <span class="absolute right-2 top-1.5 text-xs text-gray-400">j</span>
                        </div>
                    </div>
                </div>

                <div class="space-y-1.5 pt-1 inputs-moa-container ${moaOpacity}">
                     <div class="flex items-center justify-between"><label class="text-[10px] uppercase font-bold text-purple-600">Validation MOA</label><button type="button" class="copy-moe-to-moa-btn text-xs text-purple-600 hover:bg-purple-50 p-1 rounded ${moaDisabled ? 'hidden' : ''}" data-quote-id="${quote.id}"><i data-lucide="copy" class="h-3 w-3 inline"></i> Copier</button></div>
                    <div class="grid grid-cols-2 gap-x-2">
                        <div class="relative">
                            <input type="number" step="0.01" ${moaDisabled} id="validatedMoaAmount-${quote.id}" data-quote-id="${quote.id}" value="${safeVal(quote.validatedMoaAmount)}" class="negotiation-input w-full pl-2 pr-6 py-1.5 text-sm bg-purple-50 border border-purple-300 rounded-md focus:ring-1 focus:ring-purple-500 disabled:bg-gray-100" placeholder="0.00" data-field="validatedMoaAmount">
                            <span class="absolute right-2 top-1.5 text-xs text-purple-400">€</span>

                    <th scope="col" class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider pl-6">Titulaire / Prestataire</th>

        tableHtml += `<tr><td colspan="8" class="px-6 py-4 text-center text-sm text-gray-500">Aucune FTM trouvée.</td></tr>`;
    } else {
        data.forEach(ftm => {
            // 1. Récupérer les devis gagnants
            const latestQuotes = getLatestQuotes(ftm.quotes);
            const winningQuotes = latestQuotes.filter(q => q.isRejected !== true);
            
            let amountDisplay = 0;
            let companiesDisplay = "";
            let amountClass = "text-gray-900";
            
            // On normalise le statut pour éviter les erreurs d'accents (Validé vs Valide) ou de casse
            const statusLower = (ftm.status || '').toLowerCase();

            // ---------------------------------------------------------
            // 2. Calculer le montant avec la CASCADE DE PRIORITÉ ROBUSTE
            // ---------------------------------------------------------
            if (statusLower === 'annulé' || statusLower === 'annule') {
                 amountDisplay = 0;
                 amountClass = "text-gray-400 line-through";
            
            } else if (statusLower.includes('valid') && statusLower.includes('moa')) {
                 // CAS : Validé MOA (Priorité: MOA > MOE > Devis)
                 amountDisplay = winningQuotes.reduce((sum, q) => {
                     let val = 0;
                     if (isValidNum(q.validatedMoaAmount)) {
                         val = Number(q.validatedMoaAmount);
                     } else if (isValidNum(q.validatedAmount)) {
                         val = Number(q.validatedAmount);
                     } else {
                         val = Number(q.amount || 0);
                     }
                     return sum + val;
                 }, 0);
                 amountClass = "text-purple-700 font-bold";

            } else if (statusLower.includes('valid') && statusLower.includes('moe')) {
                 // CAS : Validé MOE (Priorité: MOE > Devis)
                 amountDisplay = winningQuotes.reduce((sum, q) => {
                     let val = 0;
                     if (isValidNum(q.validatedAmount)) {
                         val = Number(q.validatedAmount);
                     } else {
                         val = Number(q.amount || 0);
                     }
                     return sum + val;
                 }, 0);
                 amountClass = "text-green-600 font-bold";

            } else if (winningQuotes.length > 0) {
                 // CAS : En attente (Montant du devis)
                 amountDisplay = winningQuotes.reduce((sum, q) => sum + Number(q.amount || 0), 0);
                 amountClass = "text-blue-600";
            
            } else {
                 // CAS : Pas de devis (Estimation MOE)
                 amountDisplay = Number(ftm.moeEstimate || 0);
                 amountClass = "text-gray-500 italic";
            }
            // ---------------------------------------------------------

            // 3. Affichage Entreprises
            if (winningQuotes.length > 0) {
                companiesDisplay = winningQuotes.map(q => {
                    if (q.externalCompany) {
                        return `<span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-bold bg-amber-100 text-amber-800 border border-amber-200">
                                    <i data-lucide="briefcase" class="h-3 w-3 mr-1"></i>${q.externalCompany}
                                </span>`;
                    }
                    const lot = lots.find(l => l.number === q.workPackage);
                    const name = lot ? lot.company : q.workPackage;
                    return `<span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-gray-100 text-gray-800 border border-gray-200">
                                ${name}
                            </span>`;
                }).join(' ');
            } else {
                companiesDisplay = (ftm.lots || []).map(lotNum => {
                    const lot = lots.find(l => l.number === lotNum);
                    const name = lot ? lot.company : lotNum;
                    return `<span class="text-xs text-gray-400 italic">${name} (prévu)</span>`;
                }).join(', ');
            }

            // Utilisation de diffusionDate
            const dateToDisplay = ftm.diffusionDate || ftm.date;

            tableHtml += `
                <tr class="hover:bg-gray-50 transition-colors group">
                    <td class="px-4 py-4 whitespace-nowrap text-sm font-medium text-gray-900">${ftm.ftmNumber}</td>
                    <td class="px-4 py-4 text-sm text-gray-500 max-w-xs truncate" title="${ftm.label}">${ftm.label}</td>
                    <td class="px-4 py-4 whitespace-nowrap text-sm text-gray-500">${getOriginBadge(ftm.origin)}</td>
                    <td class="px-4 py-4 whitespace-nowrap text-sm text-gray-500">${formatDate(dateToDisplay)}</td>
                    <td class="px-4 py-4 whitespace-nowrap">
                        <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full ${getStatusChip(ftm.status)}">
                            ${ftm.status}
                        </span>
                    </td>
                    <td class="px-4 py-4 whitespace-nowrap text-right text-sm ${amountClass}">
                        ${formatCurrency(amountDisplay)}
                    </td>
                    <td class="px-4 py-4 text-sm text-gray-500 pl-6">
                        ${companiesDisplay}
                    </td>
                    <td class="px-4 py-4 whitespace-nowrap text-right text-sm font-medium">
                        <button class="summary-ftm-details-link text-indigo-600 hover:text-indigo-900 bg-indigo-50 hover:bg-indigo-100 p-2 rounded-lg transition-colors" data-id="${ftm.id}">
                            <i data-lucide="eye" class="h-4 w-4"></i>
                        </button>
                    </td>
                </tr>
            `;
        });
    }

    tableHtml += `</tbody></table>`;
    wrapper.innerHTML = tableHtml;
    lucide.createIcons();
};

const updateCompetitionLinkVisibility = () => {
    const container = document.getElementById('competition-link-container');
    const select = document.getElementById('quote-competesWithLot-select');
    const workPackageInput = document.getElementById('quote-workPackage-input');
    
    if (!container || !select || !workPackageInput) return;

    const inputValue = workPackageInput.value;
    
    // 1. On identifie l'entreprise saisie dans le devis
    const selectedLot = lots.find(l => `${l.number} - ${l.name} (${l.company})` === inputValue);

    // 2. On regarde quels sont les lots cochés dans la FTM
    const selectedLotsNumbers = Array.from(document.querySelectorAll('#lots-checkbox-container input:checked')).map(cb => cb.value);
    
    // 3. On vérifie s'il y a des TITULAIRES parmi les lots cochés
    const titulairesInvolved = lots.filter(l => selectedLotsNumbers.includes(l.number) && !l.isExternal);

    // CONDITION D'AFFICHAGE :
    if (selectedLot && selectedLot.isExternal && titulairesInvolved.length > 0) {
        
        container.classList.remove('hidden');
        
        // On sauvegarde la sélection actuelle (si l'utilisateur a déjà choisi quelque chose)
        const currentSelection = select.value; 
        
        // Construction des options
        select.innerHTML = '<option value="">-- Indépendant (Aucune concurrence) --</option>';
        select.innerHTML += titulairesInvolved.map(lot => {
            return `<option value="${lot.number}">Concurrence le Lot ${lot.number} (${lot.company})</option>`;
        }).join('');
        
        // === LOGIQUE INTELLIGENTE AJOUTÉE ===
        if (currentSelection) {
            // Si l'utilisateur avait déjà fait un choix, on le garde
            select.value = currentSelection;
        } else if (titulairesInvolved.length === 1) {
            // S'il n'y a qu'UN SEUL titulaire impliqué (ex: Lot 02), on le sélectionne par défaut !
            select.value = titulairesInvolved[0].number;
        } else {
            // S'il y a plusieurs titulaires (02 et 04), on laisse sur "Indépendant" pour forcer le choix manuel
            select.value = '';
        }
        // ====================================

    } else {
        container.classList.add('hidden');
        select.value = ''; 
    }

const handleFtmFormSubmit = (event) => {
    event.preventDefault();
    const ftmForm = document.getElementById('ftm-form');
    const formData = new FormData(ftmForm);
    
    // 1. Récupération des données brutes du formulaire
    const formEntries = Object.fromEntries(formData.entries());

    // Construction de l'objet de base avec les champs calculés
    const docType = document.querySelector('input[name="docType"]:checked').value;
    
    let ftmDataFromForm = {
        ...formEntries,
        type: docType,
        ftmNumber: docType + document.getElementById('ftmNumberInput').value,
        fpmNumber: 'FPM' + document.getElementById('fpmNumberInput').value,
        lots: Array.from(document.querySelectorAll('#lots-checkbox-container input:checked')).map(cb => cb.value),
        moeEstimate: safeParseFloat(formEntries.moeEstimate),
        quotes: formQuotes, // Variable globale gérée par le composant devis
        moeValidationDate: formData.get('moeValidationDate') || null,
        moaValidationDate: formData.get('moaValidationDate') || null,
        impacts: {}
    };

    // Gestion des impacts (Texte et Dates)
    document.querySelectorAll('.impact-lot-group').forEach(group => {
        const lotNumber = group.dataset.lot;
        const text = group.querySelector('.impact-lot-textarea').value;
        const expectedReturnDate = group.querySelector('.impact-lot-date').value;

        if (text || expectedReturnDate) {
            ftmDataFromForm.impacts[lotNumber] = {
                text: text || '',
                expectedReturnDate: expectedReturnDate || null
            };
        }
    });

    const newStatus = ftmDataFromForm.status;
    let newStatusDate = ftmDataFromForm.statusDate;
    
    // Logique de date automatique selon le statut
    if (newStatus === 'Devis validé MOA') {
        newStatusDate = ftmDataFromForm.moaValidationDate;
    } else if (["Devis validé MOE", "Devis validé entreprise après analyse MOE"].includes(newStatus)) {
        newStatusDate = ftmDataFromForm.moeValidationDate;
    }

    let finalObjectToSave; // L'objet complet et fusionné qui sera sauvegardé

    if (ftmDataFromForm.id) { 
        // --- MODE MODIFICATION ---
        const existingFtm = ftms.find(f => f.id === ftmDataFromForm.id);
        
        // Sécurité : si la FTM n'est pas trouvée (cas rare), on arrête
        if (!existingFtm) return;

        const oldStatus = existingFtm.status;

        // Logique de nettoyage d'OS si on recule le statut (Optionnel)
        let keepOs = true;
        if (oldStatus === 'Devis validé MOA' && newStatus !== 'Devis validé MOA' && existingFtm.os && existingFtm.os.length > 0) {
            if (confirm("Le statut de cette FTM n'est plus 'Validé MOA'. Voulez-vous supprimer l'Ordre de Service (OS) qui lui est associé ?")) {
                keepOs = false;
            }
        }

        // --- CORRECTION CRITIQUE ICI ---
        // On crée l'objet final en prenant TOUT ce qu'il y avait avant (existingFtm)
        // et on écrase SEULEMENT avec ce qui vient du formulaire (ftmDataFromForm)
        finalObjectToSave = {
            ...existingFtm,       // 1. On garde l'existant (OS, échanges, history, etc.)
            ...ftmDataFromForm,   // 2. On applique les modifs du formulaire (Origine, Titre, etc.)
            status: newStatus,
            statusDate: newStatusDate,
            // On s'assure explicitement que les OS sont conservés si on ne voulait pas les supprimer
            os: keepOs ? (existingFtm.os || []) : [],
            statusHistory: existingFtm.statusHistory || []
        };

        // Mise à jour de l'historique
        if (existingFtm.status !== newStatus) {
            finalObjectToSave.statusHistory.push({ status: newStatus, date: newStatusDate });
        }
        
        // Mise à jour du tableau local
        ftms = ftms.map(f => f.id === finalObjectToSave.id ? finalObjectToSave : f);

    } else { 
        // --- MODE CRÉATION ---
        finalObjectToSave = {
            ...ftmDataFromForm,
            id: `ftm-${Date.now()}`,
            exchanges: [],
            os: [],
            statusHistory: [{ status: newStatus, date: newStatusDate }]
        };
        ftms.push(finalObjectToSave);
    }

    // Sauvegarde en base de données avec l'objet COMPLET
    saveFtm(finalObjectToSave);
    
    renderBoard();
    closeModal();
};

	const handleLotFormSubmit = (e) => {
		e.preventDefault();
		const lotForm = document.getElementById('lot-form');
		const id = lotForm.querySelector('#lot-id').value;
		
		// 1. Détecter le type choisi
		const type = lotForm.querySelector('input[name="lot-type"]:checked').value; 
		const isExternal = (type === 'externe');

		const name = lotForm.querySelector('#lot-name').value;
		const company = lotForm.querySelector('#lot-company').value;
		const contactEmail = lotForm.querySelector('#lot-contactEmail').value;
		
		// 2. Gestion intelligente du Numéro
		let number = lotForm.querySelector('#lot-number').value;
		
		if (isExternal) {
			if (!id || number === "(Généré auto)") {
				 const existingExternalsCount = lots.filter(l => l.isExternal).length;
				 const nextNum = existingExternalsCount + 1;
				 number = `EXT-${nextNum.toString().padStart(2, '0')}`;
			}
		}

		// 3. Forcer les données financières à 0 si c'est un externe
		const montantMarche = isExternal ? 0 : safeParseFloat(lotForm.querySelector('#lot-montantMarche').value);
		const tauxRG = isExternal ? 0 : safeParseFloat(lotForm.querySelector('#lot-tauxRG').value);
		const montantCaution = isExternal ? 0 : safeParseFloat(lotForm.querySelector('#lot-montantCaution').value);

		const rgData = {
			// CORRECTION IMPORTANTE : On divise bien par 100 pour stocker un décimal (ex: 5 -> 0.05)
			tauxRG: isNaN(tauxRG) ? 0 : tauxRG / 100,
			montantCaution: montantCaution
		};

		// 4. Création des données du formulaire
		const formData = {
			number, 
			name, 
			company, 
			montantMarche, 
			contactEmail,
			isExternal: isExternal, 
			...rgData
		};

		let finalLotToSave;

		// 5. Sauvegarde (Logique Corrigée)
		if (id) {
			// --- CAS MODIFICATION ---
			// On récupère l'objet existant pour ne pas perdre l'historique (suiviFinancier, penalites, etc.)
			const existingLot = lots.find(l => l.id === id);
			
			// On fusionne l'existant avec les nouvelles données du formulaire
			finalLotToSave = { ...existingLot, ...formData };
			
			// Mise à jour locale
			lots = lots.map(l => l.id === id ? finalLotToSave : l);
		} else {
			// --- CAS CRÉATION ---
			finalLotToSave = {
				id: `lot-${Date.now()}`,
				isArchived: false,
				suiviFinancier: [],
				avance: null,
				penalites: [], // Initialisation importante
				...formData
			};
			lots.push(finalLotToSave);
		}

		// 6. Envoi à Firestore avec l'objet COMPLET (qui contient bien l'ID maintenant)
		saveLot(finalLotToSave);
		
		// 7. Rafraîchissement UI et Reset
		renderLotsList();
		
		lotForm.reset();
		lotForm.querySelector('#lot-id').value = '';
		
		// Remettre sur titulaire par défaut
		const defaultRadio = document.querySelector('input[name="lot-type"][value="titulaire"]');
		if (defaultRadio) {
			defaultRadio.checked = true;
			defaultRadio.dispatchEvent(new Event('change'));
		}
	};

		const exportToExcel = (type = 'ftm') => {
			if (typeof XLSX === 'undefined') {
				alert("Erreur : La bibliothèque Excel (XLSX) n'est pas chargée.");
				return;
			}

			try {
				const wb = XLSX.utils.book_new();
				let data = [];
				let rowStatuses = []; 
				let merges = []; // Tableau pour stocker les fusions de cellules
				let filename = "";
				let sheetName = "";
				let columnWidths = [];

				// --- UTILITAIRE DATE ---
				const formatDateFr = (val) => {
					if (!val || val === '-') return '-';
					const date = new Date(val);
					if (isNaN(date.getTime())) return val;
					return date.toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit', year: 'numeric' });
				};

				// --- UTILITAIRE STYLE ---
				const getStyleByStatus = (status, isHistory = false, isFirstOfBlock = true, isLastOfBlock = true) => {
					let fill = "FFFFFF";
					let color = "000000";

					if (status) {
						const s = status.toLowerCase();
						if (s.includes("éditer") || s.includes("brouillon")) { fill = "F3F4F6"; color = "374151"; }
						else if (s.includes("attente devis")) { fill = "FEF3C7"; color = "92400E"; }
						else if (s.includes("analyse") || s.includes("retour entreprise")) { fill = "DBEAFE"; color = "1E40AF"; }
						else if (s.includes("validé moe") || s.includes("validé entreprise")) { fill = "DCFCE7"; color = "166534"; }
						else if (s.includes("validé moa") || s.includes("notifié")) { fill = "F3E8FF"; color = "6B21A8"; }
						else if (s.includes("annulé")) { fill = "FEE2E2"; color = "991B1B"; }
						else if (s.includes("signature")) { fill = "CFFAFE"; color = "155E75"; }
					}

					// Atténuation visuelle pour les historiques
					if (isHistory) {
						fill = "F9FAFB"; 
						color = "9CA3AF";
					}

					// Gestion des bordures (medium = contour extérieur du bloc de la FTM, dashed = séparateur interne)
					const topBorder = isFirstOfBlock ? { style: "medium", color: { rgb: "6B7280" } } : { style: "dashed", color: { rgb: "D1D5DB" } };
					const bottomBorder = isLastOfBlock ? { style: "medium", color: { rgb: "6B7280" } } : { style: "dashed", color: { rgb: "D1D5DB" } };

					return {
						fill: { fgColor: { rgb: fill } },
						font: { 
							name: "Arial", 
							sz: 10, 
							color: { rgb: color }, 
							italic: isHistory,
							bold: !isHistory 
						},
						alignment: { vertical: "center", horizontal: "center", wrapText: true },
						border: {
							top: topBorder,
							bottom: bottomBorder,
							left: { style: "thin", color: { rgb: "E5E7EB" } },
							right: { style: "thin", color: { rgb: "E5E7EB" } }
						}
					};
				};

				if (type === 'ftm') {
					const dateDuJour = new Date().toLocaleDateString('fr-FR').replace(/\//g, '-');
					filename = `Suivi_FTM_${dateDuJour}.xlsx`;
					sheetName = "Récapitulatif FTM";

					let currentRowIndex = 1;

					ftms.forEach(ftm => {
						// --- 1. LOGIQUE ENTREPRISE ---
						const companies = (ftm.lots || []).map(lotNumberInFtm => {
							const linkedLot = lots.find(l => l.number === lotNumberInFtm);
							return linkedLot ? linkedLot.company : null;
						}).filter(c => c && c !== "").join(', ');

						// --- 2. LOGIQUE FINANCIERE ---
						const latestQuotes = getLatestQuotes(ftm.quotes);
						const winningQuotes = latestQuotes.filter(q => q.isRejected !== true);
						const proposedAmount = winningQuotes.reduce((sum, q) => sum + (q.amount || 0), 0);
						const moeValidatedAmount = winningQuotes.reduce((sum, q) => sum + (q.validatedAmount || 0), 0);
						const moaValidatedAmount = winningQuotes.reduce((sum, q) => sum + (q.validatedMoaAmount || 0), 0);
						
						let montantEngage = 0, montantProjete = 0;
						if (ftm.status === 'Devis validé MOA' || ftm.status === 'Devis validé MOE') montantEngage = moaValidatedAmount || moeValidatedAmount;
						else if (ftm.status !== 'Annulé') montantProjete = proposedAmount > 0 ? proposedAmount : (ftm.moeEstimate || 0);

						const osStatus = getFtmOsStatus(ftm);
						const osNumbers = (ftm.os || []).map(o => o.number).join(', ');

						// --- 3. TRI DES DEVIS ---
						const sortedQuotes = [...(ftm.quotes || [])].sort((a, b) => {
							const idxA = a.quoteIndex || '';
							const idxB = b.quoteIndex || '';
							if (idxA && idxB && idxA !== idxB) return idxB.localeCompare(idxA);
							return new Date(b.receiptDate || 0).getTime() - new Date(a.receiptDate || 0).getTime();
						});

						const numRows = Math.max(1, sortedQuotes.length);
						const startRow = currentRowIndex;

						// Construction des lignes de données
						if (sortedQuotes.length === 0) {
							data.push({
								"N° FTM": ftm.ftmNumber, "Entreprise(s)": companies, "Libellé": ftm.label, "Statut Actuel": ftm.status,
								"Origine": ftm.origin || '-', "Date Création": formatDateFr(ftm.diffusionDate || ftm.date),
								"Date Valid. MOE": formatDateFr(ftm.moeValidationDate), "Date Valid. MOA": formatDateFr(ftm.moaValidationDate),
								"Est. MOE (€)": ftm.moeEstimate || 0,
								"Lot": "-", "N° Devis": "-", "Ind.": "-", "Date Devis": "-",
								"Proposé Ent. (€)": 0, "Validé MOE (€)": 0, "Validé MOA (€)": 0,
								"Montant Engagé (€)": montantEngage, "Montant à Venir (€)": montantProjete,
								"Statut OS": osStatus.text, "N° OS": osNumbers, "Justification": ftm.justification || ''
							});
							rowStatuses.push({ status: ftm.status, isHistory: false, isFirstOfBlock: true, isLastOfBlock: true });
							currentRowIndex++;
						} else {
							sortedQuotes.forEach((quote, index) => {
								const isFirst = index === 0;
								const isLast = index === sortedQuotes.length - 1;

								data.push({
									"N° FTM": ftm.ftmNumber, "Entreprise(s)": companies, "Libellé": ftm.label, "Statut Actuel": ftm.status,
									"Origine": (ftm.origin || '-'), "Date Création": formatDateFr(ftm.diffusionDate || ftm.date),
									"Date Valid. MOE": formatDateFr(ftm.moeValidationDate), "Date Valid. MOA": formatDateFr(ftm.moaValidationDate),
									"Est. MOE (€)": (ftm.moeEstimate || 0),
									"Lot": quote.workPackage || "-", "N° Devis": quote.number || "-", "Ind.": quote.quoteIndex || "-",
									"Date Devis": formatDateFr(quote.receiptDate), "Proposé Ent. (€)": quote.amount || 0,
									"Validé MOE (€)": quote.validatedAmount || 0, "Validé MOA (€)": quote.validatedMoaAmount || 0,
									"Montant Engagé (€)": montantEngage, "Montant à Venir (€)": montantProjete,
									"Statut OS": osStatus.text, "N° OS": osNumbers, "Justification": (ftm.justification || '')
								});
								rowStatuses.push({ status: ftm.status, isHistory: !isFirst, isFirstOfBlock: isFirst, isLastOfBlock: isLast });
								currentRowIndex++;
							});
						}

						// --- FUSION DES CELLULES ---
						if (numRows > 1) {
							// Indices des colonnes contenant les données globales (Exclut les colonnes Devis: 9 à 15)
							const columnsToMerge = [0, 1, 2, 3, 4, 5, 6, 7, 8, 16, 17, 18, 19, 20];
							columnsToMerge.forEach(colIdx => {
								merges.push({
									s: { r: startRow, c: colIdx },
									e: { r: startRow + numRows - 1, c: colIdx }
								});
							});
						}
					});

					columnWidths = [
						{wch:15}, {wch:25}, {wch:40}, {wch:25}, {wch:20}, 
						{wch:12}, {wch:12}, {wch:12}, {wch:15}, {wch:10}, 
						{wch:15}, {wch:8},  {wch:12}, {wch:15}, {wch:15}, 
						{wch:15}, {wch:18}, {wch:18}, {wch:20}, {wch:20}, {wch:50}
					];

				} else { 
					// --- EXPORT OS ---
					const dateDuJour = new Date().toLocaleDateString('fr-FR').replace(/\//g, '-');
					filename = `Suivi_OS_${dateDuJour}.xlsx`;
					sheetName = "Récapitulatif OS";

					const linkedOs = ftms.flatMap(ftm => (ftm.os || []).map(os => {
						const amount = (os.linkedQuoteDetails || []).reduce((sum, q) => sum + q.amount, 0);
						const delayDays = (os.linkedQuoteDetails || []).reduce((sum, q) => sum + q.delay, 0);
						return { ...os, ftmNumber: ftm.ftmNumber, label: os.description, amount, delayDays, type: 'Lié FTM' };
					}));
					
					const standaloneOsList = (typeof standaloneOs !== 'undefined') ? standaloneOs : [];
					const standaloneOsWithType = standaloneOsList.map(os => ({...os, type: 'Autonome', ftmNumber: '-'}));
					const allOs = [...standaloneOsWithType, ...linkedOs].sort((a,b) => (b.number || '').localeCompare(a.number || ''));

					data = allOs.map(os => {
						const statusDetails = getOsStatusDetails(os);
						const montantEngage = (statusDetails.text === 'Notifié' || statusDetails.text === 'En signature') ? (os.amount || 0) : 0;
						const montantPrevisionnel = (montantEngage === 0) ? (os.amount || 0) : 0;

						rowStatuses.push({ status: statusDetails.text, isHistory: false, isFirstOfBlock: true, isLastOfBlock: true });

						return {
							"N° OS": os.number, "Libellé / Objet": os.label, "Statut Signature": statusDetails.text,
							"Type": os.type, "Référence FTM": os.ftmNumber, "Entreprises / Lots": (os.lots || []).join(', '),
							"Montant HT (€)": os.amount || 0, "Délai (j)": os.delayDays || 0,
							"Date Envoi": formatDateFr(os.sentToMoexDate), "Engagé (€)": montantEngage,
							"Prévisionnel (€)": montantPrevisionnel
						};
					});

					columnWidths = [{wch:15}, {wch:40}, {wch:20}, {wch:10}, {wch:15}, {wch:30}, {wch:15}, {wch:10}, {wch:12}, {wch:15}, {wch:15}];
				}

				const ws = XLSX.utils.json_to_sheet(data);
				
				// Application des fusions à la feuille
				if (merges.length > 0) {
					ws['!merges'] = merges;
				}

				const range = XLSX.utils.decode_range(ws['!ref']);
				
				// 1. En-têtes
				for (let C = range.s.c; C <= range.e.c; ++C) {
					const headerRef = XLSX.utils.encode_cell({ r: 0, c: C });
					if (ws[headerRef]) {
						ws[headerRef].s = {
							font: { bold: true, color: { rgb: "FFFFFF" } },
							fill: { fgColor: { rgb: "4B5563" } },
							alignment: { horizontal: "center", vertical: "center", wrapText: true }
						};
					}
				}

				// 2. Données et Styles
				for (let R = range.s.r + 1; R <= range.e.r; ++R) {
					const rowInfo = rowStatuses[R-1]; 
					const status = rowInfo ? rowInfo.status : '';
					const isHistory = rowInfo ? rowInfo.isHistory : false;
					const isFirstOfBlock = rowInfo ? rowInfo.isFirstOfBlock : true;
					const isLastOfBlock = rowInfo ? rowInfo.isLastOfBlock : true;

					const rowStyle = getStyleByStatus(status, isHistory, isFirstOfBlock, isLastOfBlock);

					for (let C = range.s.c; C <= range.e.c; ++C) {
						const cellRef = XLSX.utils.encode_cell({ r: R, c: C });
						if (!ws[cellRef]) ws[cellRef] = { t: 's', v: '' };

						// Deep clone du style pour l'appliquer de façon sécurisée à la cellule
						ws[cellRef].s = JSON.parse(JSON.stringify(rowStyle));

						const headerRef = XLSX.utils.encode_cell({ r: 0, c: C });
						const headerVal = ws[headerRef] ? ws[headerRef].v : '';
						
						// Alignement spécifique en haut pour les colonnes de devis non fusionnées
						if (C >= 9 && C <= 15) { 
							ws[cellRef].s.alignment.vertical = "top"; 
						}

						// Formatage Monétaire
						if (typeof headerVal === 'string' && (headerVal.includes("€") || headerVal.includes("Montant"))) {
							if (typeof ws[cellRef].v === 'number') {
								ws[cellRef].z = '#,##0.00 €';
								ws[cellRef].t = 'n';
							}
						}
					}
				}

				// --- 4. TABLEAU DE BORD (GRAPHIQUES DE PILOTAGE) ---
				if (type === 'ftm') {
					// On isole les lignes principales pour ne pas fausser les totaux avec les devis d'historique
					const mainRows = data.filter((d, index) => !rowStatuses[index].isHistory);

					const parseAmt = (val) => (typeof val === 'number' ? val : 0);
					const totalEstMOE = mainRows.reduce((acc, item) => acc + parseAmt(item["Est. MOE (€)"]), 0);
					const totalEngage = mainRows.reduce((acc, item) => acc + parseAmt(item["Montant Engagé (€)"]), 0);
					const totalAvenir = mainRows.reduce((acc, item) => acc + parseAmt(item["Montant à Venir (€)"]), 0);
					
					const statsByStatus = mainRows.reduce((acc, item) => {
						const s = item["Statut Actuel"];
						if (s) { 
							acc[s] = (acc[s] || 0) + 1;
						}
						return acc;
					}, {});

					const numberOfFtms = mainRows.length;
					let startRow = range.e.r + 3;

					XLSX.utils.sheet_add_aoa(ws, [
						["SYNTHÈSE FINANCIÈRE"],
						["Nombre de FTM", numberOfFtms],
						["Total Estimé MOE", totalEstMOE],
						["Total Engagé (Validé)", totalEngage],
						["Reste à venir (Projeté)", totalAvenir],
						[""], 
						["RÉPARTITION PAR STATUT"], 
						...Object.entries(statsByStatus)
					], { origin: { r: startRow, c: 1 } }); 

					// Style Titres Synthèse
					[0, 6].forEach(offset => {
						const titleRef = XLSX.utils.encode_cell({ r: startRow + offset, c: 1 });
						if(!ws[titleRef]) ws[titleRef] = {v: ''};
						ws[titleRef].s = { font: { bold: true, sz: 12, color: { rgb: "FFFFFF" } }, fill: { fgColor: { rgb: "1F2937" } } };
					});

					// Format Monétaire Synthèse
					[2, 3, 4].forEach(offset => {
					   const cellRef = XLSX.utils.encode_cell({ r: startRow + offset, c: 2 });
					   if(!ws[cellRef]) ws[cellRef] = {t:'n', v:0};
					   ws[cellRef].z = '#,##0.00 €';
					});
				}

				ws['!cols'] = columnWidths;
				XLSX.utils.book_append_sheet(wb, ws, sheetName);
				XLSX.writeFile(wb, filename);

			} catch (error) {
				console.error("Erreur export Excel:", error);
				alert("Une erreur est survenue.");
			}
		};

const initSortable = () => {
    if (sortableInstances.kanban) {
        sortableInstances.kanban.forEach(s => s.destroy());
    }
    sortableInstances.kanban = [];

    document.querySelectorAll('.kanban-column-cards').forEach(column => {
        const sortable = new Sortable(column, {
            group: 'kanban',
            animation: 150,
            handle: '.drag-handle',
            ghostClass: 'sortable-ghost',
            chosenClass: 'sortable-chosen',
            
            onEnd: async (evt) => { 
                const ftmId = evt.item.dataset.id;
                const newStatus = evt.to.dataset.status;

                const movedFtm = ftms.find(f => f.id === ftmId);
                
                // On ne traite que s'il y a un vrai changement de statut
                if (movedFtm && movedFtm.status !== newStatus) {
                    const oldStatus = movedFtm.status; 
                    
                    const fromStatus = "FPM reçue, FTM en cours d'édition";
                    const toStatus = "FTM transmise, en attente devis";
                    let newStatusDate = new Date().toISOString().split('T')[0];
                    
                    let proceedWithSave = true; // Drapeau pour contrôler la sauvegarde


                    // --- 2. Gérer la logique de suppression d'OS (si pas déjà annulé) ---
                    if (proceedWithSave && oldStatus === 'Devis validé MOA' && newStatus !== 'Devis validé MOA' && movedFtm.os && movedFtm.os.length > 0) {
                        if (confirm("Le statut de cette FTM n'est plus 'Validé MOA'. Voulez-vous supprimer l'Ordre de Service (OS) qui lui est associé pour maintenir la cohérence ?")) {
                            movedFtm.os = []; // L'utilisateur a confirmé la suppression de l'OS
                        } else {
                            // L'utilisateur a annulé la suppression de l'OS, on annule aussi le changement de statut
                            proceedWithSave = false; 
                        }
                    }

                    // --- 3. Sauvegarder ou Annuler ---
                    if (proceedWithSave) {
                        // On applique le nouveau statut et les dates
                        movedFtm.status = newStatus;

                        if (newStatus === "Devis validé MOA" && !movedFtm.moaValidationDate) {
                            movedFtm.moaValidationDate = newStatusDate;
                        } else if (["Devis validé MOE", "Devis validé entreprise après analyse MOE"].includes(newStatus) && !movedFtm.moeValidationDate) {
                            movedFtm.moeValidationDate = newStatusDate;
                        }

                        movedFtm.statusDate = newStatusDate;

                        // --- CORRECTION ICI ---
                        if (!movedFtm.statusHistory) movedFtm.statusHistory = [];
                        movedFtm.statusHistory.push({ status: newStatus, date: newStatusDate });
                        // ----------------------
                        
                        await saveFtm(movedFtm); // On sauvegarde les modifications
                    }
                    
                    // --- 4. Toujours redessiner le tableau ---
                    // Si proceedWithSave = true, la carte est confirmée dans la nouvelle colonne.
                    // Si proceedWithSave = false, movedFtm.status a gardé sa "oldStatus",
                    // donc renderBoard() va redessiner la carte dans son ancienne colonne (effet "snap-back").
                    renderBoard();

                } else if (movedFtm && movedFtm.status === newStatus) {
                     // L'utilisateur a déposé la carte dans sa colonne d'origine.
                     // On redessine juste au cas où pour nettoyer le DOM.
                     renderBoard();
                }
            }
        });
        sortableInstances.kanban.push(sortable);
    });
};

// VERSION FINALE CONSOLIDÉE : addDetailsModalEventListeners
const addDetailsModalEventListeners = (modalContent, ftm) => {
    const ftmId = ftm.id;

    // --- 1. FONCTION : Vérifie l'UI et déverrouille les champs MOA ---
    const checkAndToggleMoa = (quoteId) => {
        const amountInput = document.getElementById(`validatedAmount-${quoteId}`);
        const delayInput = document.getElementById(`validatedMoeDelay-${quoteId}`);
        
        if (!amountInput || !delayInput) return;

        // On récupère la valeur brute (vide ou non)
        const rawAmount = amountInput.value;
        const rawDelay = delayInput.value;
        const isValid = (rawAmount !== '' && rawDelay !== '');

        // Éléments à basculer
        const moaInputs = [
            document.getElementById(`validatedMoaAmount-${quoteId}`),
            document.getElementById(`validatedMoaDelay-${quoteId}`),
            document.getElementById(`isAccepted-${quoteId}`)
        ];
        const copyBtn = document.querySelector(`.copy-moe-to-moa-btn[data-quote-id="${quoteId}"]`);
        const moaContainer = document.querySelector(`#quote-card-${quoteId} .inputs-moa-container`);

        // Application de l'état
        moaInputs.forEach(el => { if(el) el.disabled = !isValid; });
        if (moaContainer) moaContainer.classList.toggle('opacity-50', !isValid);
        if (copyBtn) copyBtn.classList.toggle('hidden', !isValid);
    };

    // --- 2. FONCTION : Mise à jour des données (Sauvegarde) ---
    const updateQuoteValue = (e) => {
        const quoteId = e.target.dataset.quoteId;
        const field = e.target.dataset.field;
        const quote = ftm.quotes.find(q => q.id === quoteId);
        
        if (!quote || !field) return;

        let value;
        if (e.target.type === 'checkbox') {
            value = e.target.checked;
        } else if (e.target.type === 'number') {
            const cleanStr = e.target.value.replace(',', '.');
            value = cleanStr === '' ? null : parseFloat(cleanStr);
        } else {
            value = e.target.value;
        }
        
        // Mise à jour locale
        quote[field] = value;

        // UI : Vérification immédiate si on touche aux champs MOE
        if (field === 'validatedAmount' || field === 'validatedMoeDelay') {
            checkAndToggleMoa(quoteId);
        }

        // Cas spécial : "Accord Paiement" (Change le statut global)
        if (field === 'isAccepted' && value === true) {
            const newStatus = 'Devis validé MOA';
            if (ftm.status !== newStatus) {
                const newStatusDate = new Date().toISOString().split('T')[0];
                ftm.status = newStatus;
                ftm.moaValidationDate = ftm.moaValidationDate || newStatusDate;
                
                if (!ftm.statusHistory) ftm.statusHistory = [];
                ftm.statusHistory.push({ status: newStatus, date: newStatusDate });
                
                // Sauvegarde et Rechargement pour afficher le nouveau statut
                saveFtm(ftm).then(() => {
                    openDetailsModal(ftmId); 
                    renderBoard();
                });
                return;
            }
        }
        
        // Cas standard : Sauvegarde silencieuse (sans recharger la modale)
        saveFtm(ftm).then(() => {
            console.log("Donnée sauvegardée : " + field);
            // Optionnel : renderBoard(); // Si vous voulez voir le Kanban changer en direct
        });
    };

    // --- 3. LISTENERS : Inputs Devis (Montants, Délais, Checkbox) ---
    modalContent.querySelectorAll('.negotiation-input').forEach(input => {
        // 'input' : Pour la réactivité immédiate (déverrouillage UI)
        input.addEventListener('input', (e) => {
            if (e.target.type === 'number') {
                const qId = e.target.dataset.quoteId;
                checkAndToggleMoa(qId); 
                updateQuoteValue(e); 
            }
        });
        
        // 'change' : Pour valider la sauvegarde finale (et gérer les checkboxes)
        input.addEventListener('change', (e) => {
            if (e.target.type !== 'number') updateQuoteValue(e);
        });
    });

    // --- 4. LISTENERS : Boutons Copier/Coller (Helpers) ---
    modalContent.querySelectorAll('.copy-ese-to-moe-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
            const qId = e.currentTarget.dataset.quoteId;
            const quote = ftm.quotes.find(q => q.id === qId);
            if (!quote) return;

            const amtIn = document.getElementById(`validatedAmount-${qId}`);
            const delIn = document.getElementById(`validatedMoeDelay-${qId}`);

            if(amtIn) {
                amtIn.value = (quote.amount !== null && quote.amount !== undefined) ? quote.amount : '';
                amtIn.dispatchEvent(new Event('input')); // Déclenche updateQuoteValue
            }
            if(delIn) {
                delIn.value = (quote.delayDays !== null && quote.delayDays !== undefined) ? quote.delayDays : 0;
                delIn.dispatchEvent(new Event('input')); // Déclenche updateQuoteValue
            }
        });
    });

    modalContent.querySelectorAll('.copy-moe-to-moa-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
            const qId = e.currentTarget.dataset.quoteId;
            const moeAmt = document.getElementById(`validatedAmount-${qId}`);
            const moeDel = document.getElementById(`validatedMoeDelay-${qId}`);
            const moaAmt = document.getElementById(`validatedMoaAmount-${qId}`);
            const moaDel = document.getElementById(`validatedMoaDelay-${qId}`);

            if (moaAmt && !moaAmt.disabled) {
                moaAmt.value = moeAmt.value;
                moaAmt.dispatchEvent(new Event('input'));
            }
            if (moaDel && !moaDel.disabled) {
                moaDel.value = moeDel.value;
                moaDel.dispatchEvent(new Event('input'));
            }
        });
    });

    // --- 5. LISTENERS : Gestion de la Concurrence ---
    const reload = () => saveFtm(ftm).then(() => { openDetailsModal(ftmId); renderBoard(); });

    modalContent.querySelectorAll('.select-for-moe-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
            const qId = e.currentTarget.dataset.quoteId;
            const sQuote = ftm.quotes.find(q => q.id === qId);
            if (!sQuote) return;
            // Groupe de concurrence
            const grp = sQuote.competesWithLot || sQuote.workPackage || (sQuote.externalCompany || `ext-${sQuote.id}`);
            
            ftm.quotes.forEach(q => {
                const k = q.competesWithLot || q.workPackage || (q.externalCompany || `ext-${q.id}`);
                if(k === grp) q.isRejected = (q.id !== qId); // Rejette les autres, accepte celui-ci
            });
            reload();
        });
    });

    modalContent.querySelectorAll('.unselect-for-moe-btn, .reactivate-offer-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
            const qId = e.currentTarget.dataset.quoteId;
            const sQuote = ftm.quotes.find(q => q.id === qId);
            if (!sQuote) return;
            const grp = sQuote.competesWithLot || sQuote.workPackage || (sQuote.externalCompany || `ext-${sQuote.id}`);
            
            ftm.quotes.forEach(q => {
                const k = q.competesWithLot || q.workPackage || (q.externalCompany || `ext-${q.id}`);
                if(k === grp) delete q.isRejected; // Remet tout le monde en course
            });
            reload();
        });
    });

    // --- 6. LISTENERS : Actions Générales ---
	const printBtn = modalContent.querySelector('#print-ftm-btn');
	if (printBtn) {
		// MODIFICATION ICI : On appelle la config, pas l'impression directe
		printBtn.addEventListener('click', () => openPrintConfig(ftm.id));
	}
    modalContent.querySelector('.close-details-modal-btn').addEventListener('click', closeModal);
    modalContent.querySelector('#create-new-index-btn')?.addEventListener('click', () => handleCreateNewFtmIndex(ftmId));
    modalContent.querySelector('.edit-ftm-btn')?.addEventListener('click', () => openFtmModal(ftm));
    modalContent.querySelector('.edit-quotes-btn')?.addEventListener('click', () => openFtmModal(ftm, 'quotes'));
    modalContent.querySelector('.create-os-btn')?.addEventListener('click', () => openCreateOsModal(ftmId));
    
    modalContent.querySelector('.delete-btn')?.addEventListener('click', async () => {
        if (confirm('Supprimer cette FTM ?')) {
            await deleteDoc(doc(db, "artifacts", appId, "ftms", ftmId));
            ftms = ftms.filter(f => f.id !== ftmId);
            renderBoard(); closeModal();
        }
    });

    // --- 7. LISTENERS : Dates de Planification (Fixé) ---
    const realInput = modalContent.querySelector('.ftm-realisation-date-input');
    const foreInput = modalContent.querySelector('.ftm-forecast-date-input');
    
    if (realInput) {
        realInput.addEventListener('change', (e) => { 
            ftm.realisationDate = e.target.value; 
            saveFtm(ftm); // Sauvegarde correcte
        });
    }
    if (foreInput) {
        foreInput.addEventListener('change', (e) => { 
            ftm.forecastDate = e.target.value; 
            saveFtm(ftm); // Sauvegarde correcte
        });
    }

    // --- 8. LISTENERS : Messagerie ---
    const exchangeForm = modalContent.querySelector('#modal-exchange-form');
    if(exchangeForm) {
        exchangeForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const text = exchangeForm.querySelector('.exchange-text').value;
            const date = exchangeForm.querySelector('.exchange-date').value || new Date().toISOString().split('T')[0];
            const sender = exchangeForm.querySelector('.exchange-sender').value;
            if (text.trim()) {
                if (!ftm.exchanges) ftm.exchanges = [];
                ftm.exchanges.push({ id: `ex-${Date.now()}`, sender, date, text });
                saveFtm(ftm).then(() => {
                    const tl = modalContent.querySelector('#modal-timeline-container');
                    if (tl) { tl.innerHTML = renderTimeline(ftm); lucide.createIcons({nodes: [tl]}); }
                    exchangeForm.querySelector('.exchange-text').value = '';
                });
            }
        });
    }
    
    // --- 9. LISTENERS : OS ---
    modalContent.querySelectorAll('.view-os-details-btn').forEach(btn => 
        btn.addEventListener('click', (e) => openOsModal(ftmId, e.currentTarget.dataset.osId))
    );

    // --- 10. INITIALISATION ---
    // Vérification initiale de l'état des champs pour activer/désactiver le MOA si besoin
    ftm.quotes.forEach(q => checkAndToggleMoa(q.id));
};
