const renderCompanyReport = () => {
    const select = document.getElementById('company-report-select');
    const lotId = select.value;
    const container = document.getElementById('report-paper');
    
    if (!lotId || lotId === 'default') {
        container.innerHTML = '<div class="flex flex-col items-center justify-center h-96 text-gray-400"><i data-lucide="building-2" class="h-12 w-12 mb-2"></i><p>Sélectionnez une entreprise ou le Rapport Général.</p></div>';
        lucide.createIcons({root: container});
        return;
    }

    const todayStr = new Date().toLocaleDateString('fr-FR');
    const formatCurrency = (val) => new Intl.NumberFormat('fr-FR', { style: 'currency', currency: 'EUR', maximumFractionDigits: 2 }).format(val || 0);

    // ========================================================================
    // CAS 1 : RAPPORT GÉNÉRAL (PILOTAGE & RISQUES)
    // ========================================================================
    if (lotId === 'all') {
        const activeLots = lots.filter(l => !l.isArchived).sort((a, b) => a.number.localeCompare(b.number));
        
        let totalMarcheBase = 0;
        let totalActuel = 0;
        let totalPaye = 0;
        let totalRisqueFTM_Pondere = 0; 
        let totalRisqueFTM_Max = 0;      
        let totalRisqueDelta = 0;

        const rows = activeLots.map(lot => {
            // 1. Calculs Marché
            const osDuLot = [...standaloneOs, ...ftms.flatMap(f => f.os || [])].filter(os => (os.lots || []).includes(lot.number));
            const montantOS = osDuLot.reduce((sum, os) => sum + (os.amount || (os.linkedQuoteDetails||[]).reduce((s,q)=>s+q.amount,0) || 0), 0);
            const marcheActuelLot = (lot.montantMarche || 0) + montantOS;

            // 2. Calculs FTM
            const lotFtms = ftms.filter(f => 
                f.status !== 'Annulé' && 
                ((f.lots || []).includes(lot.number) || (f.quotes || []).some(q => q.workPackage === lot.number))
            );
            
            const ftmDetails = lotFtms.map(f => {
                let probability = 0;
                const s = f.status.toLowerCase();

                // Logique de probabilité
                if (s.includes('validé moa')) probability = 100;
                else if (f.manualRisk !== undefined && f.manualRisk !== null) probability = f.manualRisk;
                else {
                    if (s.includes('validé moe') || s.includes('validé entreprise')) probability = riskSettings.weights.moe_validated * 100;
                    else if (s.includes('analyse') || s.includes('retour')) probability = riskSettings.weights.analysis * 100;
                    else if (s.includes('attente') || s.includes('transmise')) probability = riskSettings.weights.pending * 100;
                    else probability = riskSettings.weights.draft * 100;
                }

                // Priorité des montants
                const quote = (f.quotes || []).find(q => q.workPackage === lot.number);
                let rawAmount = 0;

                if (quote) {
                    if (quote.validatedMoaAmount != null && quote.validatedMoaAmount !== '') {
                        rawAmount = parseFloat(quote.validatedMoaAmount);
                    } 
                    else if (quote.validatedAmount != null && quote.validatedAmount !== '') {
                        rawAmount = parseFloat(quote.validatedAmount);
                    } 
                    else {
                        rawAmount = parseFloat(quote.amount || 0);
                    }
                } else {
                    rawAmount = parseFloat(f.moeEstimate || 0);
                }

                const weightedAmount = rawAmount * (probability / 100);

                return {
                    ftmNumber: f.ftmNumber,
                    label: f.label,
                    status: f.status,
                    origin: f.origin,
                    moeEstimate: f.moeEstimate || 0,
                    rawAmount: rawAmount, 
                    probability: probability,
                    weightedAmount: weightedAmount,
                    isValidated: probability === 100
                };
            }).filter(d => d.rawAmount > 0);

            const risquePondereLot = ftmDetails.reduce((sum, item) => sum + item.weightedAmount, 0);
            const risqueMaxLot = ftmDetails.reduce((sum, item) => sum + item.rawAmount, 0);

            // 3. Delta Factu
            let cumulValide = 0;
            let cumulDemande = 0;
            (lot.suiviFinancier || []).forEach(m => {
                cumulValide += m.frozenData ? m.frozenData.travauxMoisHT : (m.validationMontantHT || 0);
                cumulDemande += (m.situationMontantHT || 0);
            });
            const delta = Math.max(0, cumulDemande - cumulValide);

            // Totaux globaux
            totalMarcheBase += (lot.montantMarche || 0);
            totalActuel += marcheActuelLot;
            totalPaye += cumulValide;
            totalRisqueFTM_Pondere += risquePondereLot;
            totalRisqueFTM_Max += risqueMaxLot;
            totalRisqueDelta += delta;

            const avancement = marcheActuelLot > 0 ? (cumulValide / marcheActuelLot) * 100 : 0;
            const isHighAlert = delta > riskSettings.alerts.deltaAmount;
            
            return {
                number: lot.number,
                company: lot.company,
                marcheActuel: marcheActuelLot,

                    </tbody>

       const groups = {}; 
       const currentMonthKey = new Date().toISOString().slice(0, 7);

       activeLots.forEach(lot => {
           (lot.suiviFinancier || []).forEach(m => {
               const valValid = m.frozenData ? m.frozenData.travauxMoisHT : (m.validationMontantHT || 0);
               const sitAmount = m.situationMontantHT || 0;
               const prevAmount = m.previsionnel || 0;

               if (m.mois < currentMonthKey && valValid === 0 && sitAmount === 0) return;

               if (!groups[m.mois]) {
                   groups[m.mois] = { 
                       key: m.mois,
                       dateObj: new Date(m.mois + '-02'),
                       totalDemande: 0,
                       totalValide: 0,
                       totalPrevi: 0, 
                       items: [] 
                   };
               }

               let status = 'future';
               let label = 'Prévisionnel';

               let badgeClass = 'bg-gray-100 text-gray-500 border-gray-200';

               let displayDemande = 0;
               let displayValide = 0;
               let displayPrevi = 0;

               if (m.validationStatut === 'Certificat Généré' || m.validationStatut === 'Validé MOE') {
                   status = 'validated';
                   label = 'Certifié';
                   rowClass = 'text-gray-800';
                   badgeClass = 'bg-green-100 text-green-700 border-green-200';
                   icon = 'check-circle-2';
                   tooltip = "Paiement validé.";
                   displayDemande = sitAmount;

               } else if (sitAmount > 0) {
                   status = 'pending';

                   badgeClass = 'bg-blue-50 text-blue-700 border-blue-200';

                   tooltip = "Facture reçue.";
                   displayDemande = sitAmount;

               });

               groups[m.mois].totalDemande += displayDemande;
               groups[m.mois].totalValide += displayValide;
               groups[m.mois].totalPrevi += displayPrevi;

       const sortedGroupKeys = Object.keys(groups).sort((a, b) => b.localeCompare(a));

       let tableRowsHtml = '';

       if (sortedGroupKeys.length === 0) {

        lucide.createIcons({root: container});

    }
	// ========================================================================
    // CAS 2 : RAPPORT INDIVIDUEL (Lot)
    // ========================================================================
    const lot = lots.find(l => l.id === lotId);
    
    // 1. Calculs Marché & OS
    const allOs = [...standaloneOs, ...ftms.flatMap(ftm => ftm.os || [])];
    const osDuLot = allOs.filter(os => (os.lots || []).includes(lot.number));
    
    // Identification des FTM qui ont DÉJÀ un OS
    const ftmIdsWithOs = new Set();
    ftms.forEach(ftm => {
        if (ftm.os && ftm.os.length > 0) {
            const osForThisLot = ftm.os.find(o => (o.lots || []).includes(lot.number));
            if (osForThisLot) ftmIdsWithOs.add(ftm.id);
        }
    });

    const totalOsAmount = osDuLot.reduce((sum, os) => {
        let amount = os.amount ?? (os.linkedQuoteDetails || []).reduce((qSum, q) => qSum + (q.amount || 0), 0);
        return sum + amount;
    }, 0);
    
    const marcheBase = lot.montantMarche || 0;
    const marcheActuel = marcheBase + totalOsAmount;

    // 2. Traitement des FTM
    const relevantFtms = ftms.filter(ftm => {
        const isTargeted = (ftm.lots || []).includes(lot.number);
        const hasQuote = (ftm.quotes || []).some(q => q.workPackage === lot.number);
        return isTargeted || hasQuote;
    }).map(ftm => {
        const lotQuotes = (ftm.quotes || []).filter(q => q.workPackage === lot.number);
        const latestQuote = getLatestQuotes(lotQuotes)[0];
    
        let montant = 0;
        let statutFinancier = 'À chiffrer';
        let style = 'text-gray-500';
        let isSecured = false; 

        if (latestQuote) {
            if (latestQuote.validatedMoaAmount != null && latestQuote.validatedMoaAmount !== '') {
                montant = parseFloat(latestQuote.validatedMoaAmount);
                statutFinancier = 'Validé MOA';
                style = 'text-purple-700 font-bold';
                isSecured = true;
            } else if (latestQuote.validatedAmount != null && latestQuote.validatedAmount !== '') {
                montant = parseFloat(latestQuote.validatedAmount);
                statutFinancier = 'Validé MOE';
                style = 'text-green-600 font-semibold';
                isSecured = true;
            } else {
                montant = parseFloat(latestQuote.amount || 0);
                statutFinancier = 'Devis Soumis';
                style = 'text-blue-600';
            }
        }

        const hasOs = ftmIdsWithOs.has(ftm.id);
        const displayStatus = hasOs ? `${statutFinancier} (OS émis)` : statutFinancier;

        return { ...ftm, quoteAmount: montant, financialStatus: displayStatus, styleClass: style, hasOs, isSecured };
        
    });

    // --- SÉPARATION PLUS VALUES / MOINS VALUES (LOGIQUE V3) ---
    // 1. On sépare les listes (On garde TOUT pour l'affichage, y compris Annulé)
    const ftmPositives = relevantFtms.filter(f => f.quoteAmount >= 0);
    const ftmNegatives = relevantFtms.filter(f => f.quoteAmount < 0);

    // 2. On calcule les totaux en EXCLUANT 'Annulé'
    const totalPlusValues = ftmPositives.reduce((sum, f) => f.status === 'Annulé' ? sum : sum + f.quoteAmount, 0);
    const totalMoinsValues = ftmNegatives.reduce((sum, f) => f.status === 'Annulé' ? sum : sum + f.quoteAmount, 0); 
    
    // Solde Net
    const deltaFTM = totalPlusValues + totalMoinsValues;

    // Totaux pour la projection (hors annulé)

            }

                    month: m.mois,
                    category: category,
                    amount: amount,
                    label: label
                });
            }
        }
    });

    const tauxRG = lot.tauxRG || 0;
    const projectionFin = marcheActuel + totalFtmAValiderOS + totalFtmEnEtude;
    const resteAFacturerHT = projectionFin - cumulTravauxHT;
    const progressPercent = projectionFin > 0 ? (cumulTravauxHT / projectionFin) * 100 : 0;

    // --- HTML INDIVIDUEL ---

            <div class="grid grid-cols-3 gap-4 mt-2">
                <div class="col-span-1"></div>
                <div class="col-span-2 bg-gray-50 rounded-lg p-3 border border-gray-200 flex items-center justify-between">
                    <span class="text-xs font-bold text-gray-500 uppercase">Solde Net FTM (Delta)</span>
                    <div class="flex items-center gap-4">
                        <span class="text-xs text-gray-400">Total (+) ${formatCurrency(totalPlusValues)}</span>
                        <span class="text-xs text-red-300">Total (-) ${formatCurrency(totalMoinsValues)}</span>
                        <span class="text-lg font-bold ${deltaFTM >= 0 ? 'text-indigo-700' : 'text-red-600'}">

        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">

                </h3>
                <div class="border rounded-lg overflow-hidden bg-white shadow-sm ring-1 ring-gray-100">
                    <table class="w-full text-xs text-left">
                        <thead class="bg-gray-50 text-gray-500 uppercase font-bold tracking-wider border-b border-gray-200">
                            <tr>
                                <th class="px-3 py-3">Mois</th>
                                <th class="px-3 py-3 text-center">N°</th>
                                <th class="px-3 py-3 text-center">État</th>
                                <th class="px-3 py-3 text-right hidden sm:table-cell">Reçu le</th>
                                <th class="px-3 py-3 text-right text-gray-400">Mt Ent.</th>
                                <th class="px-3 py-3 text-right">Validé MOE</th>
                                <th class="px-3 py-3 text-right bg-blue-50/50 text-blue-800 border-l border-blue-100">% Cumul</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-gray-100">
                            ${(() => {
                                // 1. Préparation et calcul chronologique (du plus vieux au plus récent)
                                // pour avoir un cumul correct
                                let runningTotal = 0;
                                const monthsToProcess = sortedMonths.filter(m => m.mois <= currentMonthKey);

                                if (monthsToProcess.length === 0) {
                                    return '<tr><td colspan="7" class="py-6 text-center text-gray-400 italic">Aucun historique disponible.</td></tr>';
                                }

                                const processedRows = monthsToProcess.map(m => {
                                    // Variables existantes
                                    const val = m.frozenData ? m.frozenData.travauxMoisHT : (m.validationMontantHT || 0);
                                    const sitAmount = m.situationMontantHT || 0;
                                    
                                    // Calcul du cumul
                                    runningTotal += val;
                                    
                                    // Calcul pourcentage (1 chiffre après la virgule : 0.0)
                                    // Note : On suppose que 'marcheActuel' est disponible dans la portée, sinon remplacer par (marcheInitial + totalOS)
                                    const percent = marcheActuel > 0 ? ((runningTotal / marcheActuel) * 100).toFixed(1) : "0.0";

                                    // Delta & Dates
                                    const delta = val - sitAmount;
                                    const hasDelta = Math.abs(delta) > 1 && sitAmount > 0;
                                    const dateRecu = m.situationDate ? new Date(m.situationDate).toLocaleDateString('fr-FR', {day:'2-digit', month:'2-digit'}) : '-';
                                    const isMissingSituationData = (sitAmount === 0 && val > 0 && m.validationStatut !== 'Certificat Généré');

                                    // Détermination du Badge d'État
                                    let statusBadge = '';
                                    if (m.validationStatut === 'Certificat Généré') {
                                        statusBadge = '<span class="inline-flex items-center px-2 py-0.5 rounded text-[9px] font-bold bg-green-100 text-green-700 border border-green-200 uppercase tracking-wide">Certifié</span>';

                                    return {
                                        m, val, sitAmount, delta, hasDelta, dateRecu, 
                                        isMissingSituationData, statusBadge, percent
                                    };
                                });

                                // 2. Affichage Inversé (Le plus récent en haut)
                                return processedRows.reverse().map(row => {
                                    // Si tout est vide, on n'affiche pas (logique existante conservée)
                                    if (row.val === 0 && row.sitAmount === 0 && row.m.validationStatut !== 'Certificat Généré') return '';

                                            ${row.hasDelta ? `<div class="text-[9px] text-red-500 font-bold mt-0.5" title="Correction MOE">${row.delta > 0 ? '+' : ''}${formatCurrency(row.delta)}</div>` : ''}
                                        </td>
                                        
                                        <td class="px-3 py-2.5 text-right font-bold text-blue-700 bg-blue-50/30 border-l border-blue-50 text-xs">

            <div>

        <div class="mt-8 text-center text-[10px] text-gray-400">
            Document généré le ${todayStr} - Les montants sont donnés à titre indicatif hors pénalités éventuelles.

    container.innerHTML = html;
    lucide.createIcons({root: container});
};

                // --- Fonctions UI ---
                const updateMontantCalcule = () => {
                    const type = form.querySelector('input[name="avance-type"]:checked').value;
                    const valeur = parseFloat(valeurInput.value) || 0;
                    let calcule = 0;
                    if (type === 'montant') {
                        calcule = valeur;
                    } else { // pourcentage
                        calcule = montantMarcheBase * (valeur / 100);
                    }
                    montantCalculeInput.value = calcule.toFixed(2);
                };

                const toggleDebutWrappers = () => {
                    const typeDebut = form.querySelector('input[name="avance-typeDebut"]:checked').value;
                    if (typeDebut === 'mois') {
                        wrapperDebutMois.classList.remove('hidden');
                        wrapperDebutPourcentage.classList.add('hidden');

                    }
                };

		const exportFinancialSummary = () => {
		// --- VÉRIFICATION BIBLIOTHÈQUE ---
		if (typeof XLSX === 'undefined') {
			alert("Erreur : La bibliothèque XLSX n'est pas chargée.");
			return;
		}

		try {
			const TVA_RATE = 0.20;
			const workbook = XLSX.utils.book_new();

			// =========================================================
			// FEUILLE 1 : SUIVI FINANCIER PAR LOT (Votre code original optimisé)
			// =========================================================
			
			// Calcul des totaux OS par lot
			// (On suppose que `allOs` est calculé comme dans votre code original)
			const allOs = [
				...standaloneOs,
				...ftms.flatMap(ftm => (ftm.os || []).map(os => {
					const amount = (os.linkedQuoteDetails || []).reduce((sum, q) => sum + (q.amount || 0), 0);
					return { ...os, amount };
				}))
			];

			const osTotalsByLot = lots.reduce((acc, lot) => {
				acc[lot.number] = allOs
					.filter(os => (os.lots || []).includes(lot.number))
					.reduce((sum, os) => sum + (os.amount || 0), 0);
				return acc;
			}, {});

			const financialData = lots.filter(l => !l.isArchived).map(lot => {
				const montantMarcheBase = lot.montantMarche || 0;
				const montantOS = osTotalsByLot[lot.number] || 0;
				const montantFactureHT = (lot.suiviFinancier || []).reduce((totalSum, monthlyItem) => {
					return totalSum + (monthlyItem.factures || []).reduce((mSum, inv) => mSum + inv.montantHT, 0);
				}, 0);

				const marcheEtOsHT = montantMarcheBase + montantOS;
				
				return {
					"Lot": lot.number,
					"Entreprise": lot.company,
					"Montant Marché Base HT": montantMarcheBase,
					"Montant OS HT": montantOS,
					"Total Marché HT": marcheEtOsHT,
					"Total Marché TTC": marcheEtOsHT * (1 + TVA_RATE),
					"Montant Facturé HT": montantFactureHT,
					"% Avancement": marcheEtOsHT !== 0 ? (montantFactureHT / marcheEtOsHT) : 0
				};
			});

			const sheetFinances = XLSX.utils.json_to_sheet(financialData);
			// Formatage simple pour la feuille 1
			financialData.forEach((row, i) => {
				if(sheetFinances['H' + (i + 2)]) sheetFinances['H' + (i + 2)].z = '0.00%'; // Pourcentage
				['C','D','E','F','G'].forEach(col => {
					if(sheetFinances[col + (i + 2)]) sheetFinances[col + (i + 2)].z = '#,##0.00 €';
				});
			});
			XLSX.utils.book_append_sheet(workbook, sheetFinances, "Suivi Lots");

			// =========================================================
			// FEUILLE 2 : SUIVI DES FTM (NOUVELLE DEMANDE)
			// =========================================================

			const ftmExportData = ftms.map(ftm => {
				// 1. LOGIQUE POUR LA 2E COLONNE (Entreprises concernées)
				// On regarde les lots liés à la FTM, puis on cherche l'entreprise dans la liste des lots
				const concernedCompanies = (ftm.lots || []).map(lotNum => {
					const foundLot = lots.find(l => l.number === lotNum);
					return foundLot ? foundLot.company : null;
				}).filter(Boolean).join(", "); // Joint les noms par une virgule

				// Calcul du montant total des devis associés à cette FTM
				const totalQuotesAmount = (ftm.quotes || []).reduce((sum, quote) => sum + (quote.amount || 0), 0);

				return {
					"N° FTM": ftm.ftmNumber || ftm.id,
					"Entreprises": concernedCompanies || "Non défini", // <--- LA COLONNE AJOUTÉE
					"Date Diffusion": ftm.diffusionDate,
					"Objet": ftm.label,
					"Justification": ftm.justification,
					"Statut": ftm.status || "En cours",
					"Montant Devis HT": totalQuotesAmount,
					"Date Retour Prévue": (ftm.impacts && ftm.impacts["01"]) ? ftm.impacts["01"].expectedReturnDate : ""
				};
			});

			const sheetFTM = XLSX.utils.json_to_sheet(ftmExportData);

			// --- AJOUT DES GRAPHIQUES DE PILOTAGE (TABLEAU DE BORD) EN BAS ---
			// Note: SheetJS ne peut pas créer de graphiques visuels (camemberts) nativement,
			// mais nous pouvons créer un tableau de synthèse chiffré très utile.
			
			const rowStart = ftmExportData.length + 4; // Quelques lignes sous le tableau
			
			// Calculs des KPIs
			const totalFTMAmount = ftmExportData.reduce((sum, item) => sum + item["Montant Devis HT"], 0);
			const countFTM = ftmExportData.length;
			// Compter les statuts uniques
			const statusCounts = ftmExportData.reduce((acc, item) => {
				acc[item.Statut] = (acc[item.Statut] || 0) + 1;
				return acc;
			}, {});

			// Création des données du tableau de bord
			XLSX.utils.sheet_add_aoa(sheetFTM, [
				["TABLEAU DE BORD PILOTAGE FTM"], // Titre
				["Indicateur Clé", "Valeur"],     // En-têtes
				["Nombre total de FTM", countFTM],
				["Montant Total FTM HT", totalFTMAmount],
				["", ""], // Ligne vide
				["Répartition par Statut", "Nombre"] // Sous-titre
			], { origin: "B" + rowStart });

			// Ajouter les statuts dynamiquement
			let currentRow = rowStart + 6;
			Object.keys(statusCounts).forEach(status => {
				XLSX.utils.sheet_add_aoa(sheetFTM, [[status, statusCounts[status]]], { origin: "B" + currentRow });
				currentRow++;
			});

			// --- FORMATAGE FEUILLE FTM ---
			// Largeur des colonnes
			sheetFTM['!cols'] = [
				{ wch: 15 }, { wch: 30 }, { wch: 12 }, { wch: 40 }, 
				{ wch: 30 }, { wch: 20 }, { wch: 15 }, { wch: 15 }
			];

			// Format monétaire pour la colonne Montant (G)
			ftmExportData.forEach((_, i) => {
				const cellRef = 'G' + (i + 2);
				if (sheetFTM[cellRef]) sheetFTM[cellRef].z = '#,##0.00 €';
			});
			
			// Format monétaire pour le KPI Total (Celle C + (rowStart + 3)) -> ajustement selon position
			// Ici on simplifie, le formatage des cellules ajoutées via sheet_add_aoa doit être fait manuellement si besoin.

			XLSX.utils.book_append_sheet(workbook, sheetFTM, "Suivi FTM & Pilotage");

			// ÉCRITURE DU FICHIER
			XLSX.writeFile(workbook, "Suivi_Financier_et_FTM.xlsx");

		} catch (error) {
			console.error("Erreur export :", error);
			alert("Une erreur est survenue lors de l'export.");
		}
	};

                const clone = modalEl.cloneNode(true);

										<td class="py-2 text-right font-mono font-bold text-gray-800">${fmt(soldeHT)}</td>
									</tr>
									<tr class="border-b border-gray-100">
										<td class="py-2 text-gray-400 text-xs uppercase tracking-wider">TVA (20%)</td>
										<td class="py-2 text-right font-mono text-gray-500">${fmt(soldeHT * 0.2)}</td>
									</tr>
									<tr>
										<td colspan="2" class="py-4 text-right">
											<div class="font-bold text-black uppercase tracking-wider text-sm mb-1">
												Net à Payer TTC
											</div>
											<div class="font-mono font-extrabold text-black text-3xl">
												${fmt(soldeTTC)}
											</div>
										</td>
									</tr>
								</table>
							</div>
						</div>

						<div class="bg-gray-50 p-6 rounded-sm border border-gray-100 text-[9px] text-gray-500 text-justify leading-relaxed">
							<p class="mb-2"><strong>1. VALEUR DU DOCUMENT :</strong> Le présent DGD est établi selon la norme NF P 03-001 et le CCAG Travaux. Il arrête définitivement le montant des travaux. Sa signature vaut renonciation à toute réclamation ultérieure.</p>
							<p><strong>2. RETENUE DE GARANTIE :</strong> Conformément à la loi n° 71-584 du 16 juillet 1971, le montant de la Retenue de Garantie indiqué ci-dessus (correspondant à 5% du montant TTC des travaux réalisés) a été consigné. 
							<span class="text-black font-semibold">Cette somme sera libérée à l'expiration du délai de garantie de parfait achèvement (un an après la réception), sauf opposition motivée par LRAR pour inexécution des réserves.</span></p>
						</div>
					</div>

					<div class="mt-8 grid grid-cols-3 gap-8 text-[10px] uppercase font-bold text-gray-500 tracking-widest break-inside-avoid">
						<div><p class="mb-6 border-b border-gray-200 pb-1">Pour l'Entreprise<br><span class="text-[8px] font-normal opacity-70">(Bon pour accord)</span></p><div class="h-20 bg-white border border-gray-200"></div></div>
						<div><p class="mb-6 border-b border-gray-200 pb-1">Pour la Maîtrise d'Œuvre<br><span class="text-[8px] font-normal opacity-70">(Vérification)</span></p><div class="h-20 bg-white border border-gray-200"></div></div>
						<div><p class="mb-6 border-b border-gray-200 pb-1">Pour le Maître d'Ouvrage<br><span class="text-[8px] font-normal opacity-70">(Acceptation)</span></p><div class="h-20 bg-white border border-gray-200"></div></div>
					</div>
				`;
			};

			// --- EVENTS ---
			document.querySelectorAll('.dgd-input').forEach(i => i.addEventListener('input', renderPreview));
			const btn = document.getElementById('dgd-print-btn');
			if(btn) btn.onclick = () => {
				const c = document.getElementById('dgd-preview-page').innerHTML;
				const w = window.open('','','height=900,width=800');
				w.document.write(`<html><head><title>DGD</title><script src="https://cdn.tailwindcss.com"><\/script><style>@page{size:A4;margin:12mm;}body{font-family:'Inter', sans-serif; -webkit-print-color-adjust: exact; print-color-adjust: exact;}</style></head><body class="p-8 flex flex-col min-h-[290mm]">${c}</body></html>`);
				w.document.close(); setTimeout(() => w.print(), 800);
			};
			const close = document.getElementById('close-dgd-modal-btn');
			if(close) close.onclick = closeModal;

			renderPreview();
		});
	};
	
	</script>
</body>
</html>
