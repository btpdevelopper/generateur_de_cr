<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Inclusion des icônes Lucide -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Inclusion de SortableJS pour le glisser-déposer -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>

    <!-- Inclusion de Chart.js pour les graphiques -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns/dist/chartjs-adapter-date-fns.bundle.min.js"></script>

    <!-- Police Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
	
	
    <style>
        /* Appliquer la police Inter à toute l'application */
        body {
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        /* Style pour éviter le décalage de la scrollbar lors de l'ouverture du modal */
        .modal-open {
            overflow: hidden;
            padding-right: 15px; /* Ajuster à la largeur de la scrollbar */
        }
        /* Style pour la poignée de glisser-déposer */
        .drag-handle, .drag-handle-signature {
            cursor: grab;
        }
        .sortable-ghost {
            opacity: 0.4;
            background: #e0e7ff;
            border: 2px dashed #6366f1;
            border-radius: 0.75rem;
        }
        .sortable-chosen {
            cursor: grabbing;
        }
        /* Layout pleine hauteur avec fond en dégradé */
        html {
            height: 100%;
        }
        body {
            min-height: 100%;
            background: linear-gradient(170deg, #f3f4f6, #e5e7eb);
        }
        main {
            height: calc(100vh - 72px); /* Hauteur du header */
        }
        .kanban-column-cards {
            max-height: calc(100vh - 250px); /* Ajuster selon header + titre colonne + hauteur stats */
        }
        /* Scrollbar personnalisée */
        .custom-scrollbar::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #e5e7eb;
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #9ca3af;
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #6b7280;
        }
        /* Cacher les boutons radio pour les types de liens */
        .link-type-radio {
            display: none;
        }
        /* Style pour les labels agissant comme des boutons */
        .link-type-label {
            cursor: pointer;
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            transition: all 0.2s ease-in-out;
            border: 2px solid transparent;
        }
        /* Style pour le label sélectionné */
        .link-type-radio:checked + .link-type-label {
            background-color: #eef2ff; /* indigo-50 */
            color: #4338ca; /* indigo-700 */
            border-color: #6366f1; /* indigo-500 */
        }
        /* Style pour les onglets de la modale récap */
        .summary-tab {
            border-bottom: 2px solid transparent;
            transition: all 0.2s ease-in-out;
        }
        .summary-tab.active {
            border-color: #4f46e5; /* indigo-600 */
            color: #4f46e5;
            font-weight: 600;
        }
        .archived {
            opacity: 0.6;
            background-color: #f3f4f6;
        }
		
		@keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
            20%, 40%, 60%, 80% { transform: translateX(5px); }
        }
        .animate-shake {
            animation: shake 0.5s ease-in-out;
        }
		
		
		/* --- INTEGRATION DGD STYLES --- */
		.dgd-section-card {
			background: white;
			border-radius: 12px;
			border: 1px solid #e2e8f0;
			overflow: hidden;
			transition: box-shadow 0.2s;
			margin-bottom: 1rem;
		}
		.dgd-section-card[open] {
			box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
		}
		.dgd-input {
			transition: all 0.2s ease;
			background: white;
			border: 1px solid #e2e8f0;
			width: 100%;
		}
		.dgd-input:focus {
			border-color: #3b82f6;
			outline: none;
			box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
		}
		@media print {
			.no-print { display: none !important; }
			.print-area { display: block !important; }
			.dgd-page { margin: 0 !important; border: none !important; width: 100% !important; }
		}
		
		
    </style>
</head>
<body class="text-gray-900 flex flex-col h-screen">

	<script type="text/html" id="firebase-config-modal-template">
        <div id="firebase-config-modal" class="fixed inset-0 bg-black/80 z-50 flex justify-center items-center transition-opacity duration-300" style="opacity:0;">
            <div class="bg-white rounded-2xl shadow-2xl w-full max-w-2xl mx-4 transform transition-transform duration-300 scale-95" role="dialog" aria-modal="true">
                <div class="p-5 border-b border-gray-200">
                    <h2 class="text-xl font-bold text-gray-800 flex items-center"><i data-lucide="database" class="mr-3 text-amber-500"></i>Configuration Firebase</h2>
                </div>
                <form id="firebase-config-form">
                    <div class="p-6 max-h-[70vh] overflow-y-auto custom-scrollbar">
                        <p class="text-sm text-gray-600 mb-6">Veuillez copier-coller les informations de configuration de votre projet depuis la console Firebase. <br> (Projet > Paramètres du projet > Général > Vos applications > SDK setup and configuration)</p>
                        
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-x-6 gap-y-4">
                            <div>
                                <label for="apiKey" class="font-medium text-sm text-gray-700">apiKey</label>
                                <input type="text" id="apiKey" required class="mt-1 w-full px-3 py-2 bg-gray-50 border rounded-lg focus:ring-2 focus:ring-amber-500 outline-none">
                            </div>
                             <div>
                                <label for="authDomain" class="font-medium text-sm text-gray-700">authDomain</label>
                                <input type="text" id="authDomain" required class="mt-1 w-full px-3 py-2 bg-gray-50 border rounded-lg focus:ring-2 focus:ring-amber-500 outline-none">
                            </div>
                             <div>
                                <label for="projectId" class="font-medium text-sm text-gray-700">projectId</label>
                                <input type="text" id="projectId" required class="mt-1 w-full px-3 py-2 bg-gray-50 border rounded-lg focus:ring-2 focus:ring-amber-500 outline-none">
                            </div>
                             <div>
                                <label for="storageBucket" class="font-medium text-sm text-gray-700">storageBucket</label>
                                <input type="text" id="storageBucket" required class="mt-1 w-full px-3 py-2 bg-gray-50 border rounded-lg focus:ring-2 focus:ring-amber-500 outline-none">
                            </div>
                             <div>
                                <label for="messagingSenderId" class="font-medium text-sm text-gray-700">messagingSenderId</label>
                                <input type="text" id="messagingSenderId" required class="mt-1 w-full px-3 py-2 bg-gray-50 border rounded-lg focus:ring-2 focus:ring-amber-500 outline-none">
                            </div>
                             <div>
                                <label for="appId" class="font-medium text-sm text-gray-700">appId (Firebase)</label>
                                <input type="text" id="appId" required class="mt-1 w-full px-3 py-2 bg-gray-50 border rounded-lg focus:ring-2 focus:ring-amber-500 outline-none">
                            </div>
                             <div class="md:col-span-2">
                                <label for="measurementId" class="font-medium text-sm text-gray-700">measurementId (Optionnel)</label>
                                <input type="text" id="measurementId" class="mt-1 w-full px-3 py-2 bg-gray-50 border rounded-lg focus:ring-2 focus:ring-amber-500 outline-none">
                            </div>
                        </div>
                        <div id="firebase-error-message" class="mt-4 text-sm text-center text-red-600 bg-red-50 p-3 rounded-lg hidden"></div>
                    </div>
                    <div class="flex justify-end p-4 bg-gray-50 border-t rounded-b-2xl">
                        <button type="submit" id="submit-firebase-config" class="px-6 py-2 rounded-lg bg-amber-600 hover:bg-amber-700 text-white font-semibold transition-colors">
                            <span>Tester et Continuer</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </script>

    <script type="text/html" id="app-id-modal-template">

<script type="text/html" id="ftm-modal-template">
    <div id="ftm-modal" class="fixed inset-0 bg-black/80 z-50 flex justify-center items-center transition-opacity duration-300" style="opacity:0;">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-6xl mx-4 h-[85vh] flex flex-col transform transition-transform duration-300 scale-95 overflow-hidden" role="dialog" aria-modal="true">
            
			<div class="flex-none px-8 py-6 border-b border-gray-100 bg-white z-10 relative overflow-hidden">
                <div class="absolute top-0 right-0 -mt-4 -mr-4 w-32 h-32 bg-gray-50 rounded-full blur-3xl opacity-50 pointer-events-none"></div>
                
                <div class="flex justify-between items-start relative">
                    <div class="flex gap-5">
                        <div id="header-icon-container" class="flex-shrink-0 w-12 h-12 bg-gray-100 rounded-xl flex items-center justify-center text-gray-500 shadow-sm border border-gray-200">
                            <i data-lucide="file-edit" class="h-6 w-6"></i>
                        </div>

                        <div class="space-y-1">

// Fonction de migration optimisée (par paquets de 400 pour éviter le crash réseau/limite)
const migrateToCollections = async () => {
    console.log("Démarrage de la migration par lots...");
    
    // 1. Préparer toutes les opérations d'écriture dans une liste
    const operations = [];
    
    // A. Config Globale
    const globalRef = doc(db, "artifacts", appId);
    operations.push({ ref: globalRef, data: { version: 2, financialConfig: financialConfig } });

    // B. FTMs
    ftms.forEach(ftm => {
        if(!ftm.id) ftm.id = `ftm-${Date.now()}-${Math.random().toString(36).substr(2,9)}`;
        const ref = doc(db, "artifacts", appId, "ftms", ftm.id);
        operations.push({ ref: ref, data: ftm });
    });

    // C. Lots
    lots.forEach(lot => {
        if(!lot.id) lot.id = `lot-${Date.now()}-${Math.random().toString(36).substr(2,9)}`;
        const ref = doc(db, "artifacts", appId, "lots", lot.id);
        operations.push({ ref: ref, data: lot });
    });

    // D. Personnel
    personnel.forEach(p => {
        if(!p.id) p.id = `p-${Date.now()}-${Math.random().toString(36).substr(2,9)}`;
        const ref = doc(db, "artifacts", appId, "personnel", p.id);
        operations.push({ ref: ref, data: p });
    });

    // E. OS Indépendants
    standaloneOs.forEach(os => {
        if(!os.id) os.id = `os-${Date.now()}-${Math.random().toString(36).substr(2,9)}`;
        const ref = doc(db, "artifacts", appId, "standaloneOs", os.id);
        operations.push({ ref: ref, data: os });
    });

    // 2. Exécuter les écritures par paquets de 400 (Limite Firestore = 500)
    const CHUNK_SIZE = 400;
    for (let i = 0; i < operations.length; i += CHUNK_SIZE) {
        const chunk = operations.slice(i, i + CHUNK_SIZE);
        const batch = writeBatch(db);
        
        chunk.forEach(op => {
            batch.set(op.ref, op.data);
        });

        console.log(`Migration du paquet ${i/CHUNK_SIZE + 1} / ${Math.ceil(operations.length/CHUNK_SIZE)}...`);
        await batch.commit(); // On attend que ce paquet soit fini avant de passer au suivant
    }

};

// Fonction de nettoyage des données (Data Patching)
// Gardée pour assurer que les vieilles données s'affichent correctement
const runDataPatches = () => {
    ftms.forEach(ftm => {
        if (!ftm.type) ftm.type = 'FTM';
        if (!ftm.os) ftm.os = [];
		if (!ftm.statusHistory) ftm.statusHistory = [];
        ftm.os = ftm.os.map(os => {
            if (!os.signatureChain) os.signatureChain = [];
            if (!os.lots) os.lots = [];
            if (!os.linkedQuoteDetails) os.linkedQuoteDetails = [];
            return os;
        });
        // Patch Impacts (Conversion string -> object)
        if (ftm.impacts) {
            Object.keys(ftm.impacts).forEach(lotNumber => {
                if (typeof ftm.impacts[lotNumber] === 'string') {
                    ftm.impacts[lotNumber] = {
                        text: ftm.impacts[lotNumber],
                        expectedReturnDate: null
                    };
                }
            });
        }
    });
    
    standaloneOs = standaloneOs.map(os => {
        if (!os.signatureChain) os.signatureChain = [];
        if (!os.lots) os.lots = [];
        return os;
    });
    
    lots.forEach(l => { 
        if(l.isArchived === undefined) l.isArchived = false;
        if(l.penalites === undefined) l.penalites = [];
        // Migration Penalties (Old -> New)
        if (l.penalties && l.penalties.length > 0 && l.penalites.length === 0) {
            l.penalites = l.penalties;
        }
        
        // Migration Suivi Financier
        if (!l.suiviFinancier) l.suiviFinancier = [];
        
        l.suiviFinancier = l.suiviFinancier.map(item => {
            const hasFactures = item.factures && item.factures.length > 0;
            const defaultMontantValide = hasFactures ? item.factures.reduce((sum, f) => sum + f.montantHT, 0) : 0;
            
            // Structure par défaut pour le workflow financier
            const defaults = {
                situationNumero: '',
                situationDate: null,
                situationMontantHT: hasFactures ? defaultMontantValide : 0,
                validationStatut: hasFactures ? 'Certificat Généré' : 'Attente MOE',
                validationMontantHT: defaultMontantValide,
                validationDate: hasFactures ? (item.factures[0].dateFacture || null) : null
            };
            
            return { ...defaults, ...item };
        });
    });
};

            const completed = os.signatureChain.filter(s => s.date).length;

 const getFinancialAlertStatus = (monthStr, situationDate, validationDate, validationStatut) => {
    const today = new Date();
    const currentYear = today.getFullYear();
    const currentMonth = today.getMonth() + 1; // 1-12
    
    const [targetYearStr, targetMonthStr] = monthStr.split('-');
    const targetYear = parseInt(targetYearStr);
    const targetMonth = parseInt(targetMonthStr);

    // On ne gère pas les alertes pour les mois futurs
    if (targetYear > currentYear || (targetYear === currentYear && targetMonth > currentMonth)) {
        return { type: 'future', label: '', color: '' };
    }

    // --- 1. ANALYSE SOUMISSION ENTREPRISE ---
    if (!situationDate) {
        // Pas encore reçu
        
        // Est-ce le mois en cours ?
        if (targetYear === currentYear && targetMonth === currentMonth) {
            const currentDay = today.getDate();
            const startDay = financialConfig.submissionStartDay;
            
            // Calcul du dernier jour pour la date limite
            let endDay = 31;
            if (financialConfig.submissionEndType === 'fixed') {
                endDay = financialConfig.submissionEndDay;
            } else {
                // Dernier jour du mois cible
                endDay = new Date(targetYear, targetMonth, 0).getDate();
            }

            if (currentDay < startDay) {
                return { type: 'wait', label: 'Attente Période', color: 'bg-gray-100 text-gray-500', icon: 'clock' };
            } else if (currentDay >= startDay && currentDay <= endDay) {
                return { type: 'expecting', label: 'Attente Situation', color: 'bg-blue-100 text-blue-700 animate-pulse', icon: 'inbox' };
            } else {
                return { type: 'late_submission', label: 'Retard Soumission', color: 'bg-red-100 text-red-700 border border-red-200', icon: 'alert-triangle' };
            }
        } else {
            // Mois passé et toujours rien reçu
            return { type: 'missing', label: 'Situation Manquante', color: 'bg-red-100 text-red-700 font-bold', icon: 'x-circle' };
        }
    }

    // --- 2. ANALYSE VALIDATION MOE ---
    // Si reçu mais pas encore totalement validé (ou certifié)
    if (validationStatut !== 'Validé MOE' && validationStatut !== 'Certificat Généré') {
        const receptionDate = new Date(situationDate);
        const diffTime = Math.abs(today - receptionDate);
        const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)); 
        
        if (diffDays > financialConfig.validationDeadline) {
            return { 
                type: 'late_validation', 
                label: `Retard Valid. (+${diffDays - financialConfig.validationDeadline}j)`, 
                color: 'bg-orange-100 text-orange-800 border border-orange-200 font-bold', 
                icon: 'hourglass' 
            };
        } else {
            const remaining = financialConfig.validationDeadline - diffDays;
            return { 
                type: 'pending_validation', 
                label: `À valider (${remaining}j restants)`, 
                color: 'bg-indigo-100 text-indigo-700', 
                icon: 'user-check' 
            };
        }
    }

    // Tout est OK
    return { type: 'ok', label: 'OK', color: 'text-green-600', icon: 'check' };
};

// Fonction pour nettoyer automatiquement les guillemets Windows lors du collage
const setupPathInputAutoClean = (inputId) => {
    const input = document.getElementById(inputId);
    if (!input) return;

    // 1. Interception du collage (Paste)
    input.addEventListener('paste', (e) => {
        // Empêche le collage par défaut pour qu'on puisse manipuler le texte
        e.preventDefault();
        
        // Récupère le texte du presse-papier
        const text = (e.clipboardData || window.clipboardData).getData('text');
        
        if (text) {
            // Enlève les guillemets au début et à la fin, et les espaces superflus
            // La regex /^"|"$/g cible le guillemet de début (^) et de fin ($)
            const cleanText = text.replace(/^"|"$/g, '').trim();
            
            // Insère le texte propre
            input.value = cleanText;
            
            // Déclenche les événements pour que le reste de l'app sache que ça a changé
            input.dispatchEvent(new Event('input'));
            input.dispatchEvent(new Event('change'));
        }
    });

    // 2. Sécurité supplémentaire à la perte du focus (Blur)
    // Au cas où l'utilisateur taperait les guillemets manuellement
    input.addEventListener('blur', () => {
        const val = input.value;
        if (val.startsWith('"') || val.endsWith('"')) {
            input.value = val.replace(/^"|"$/g, '').trim();
            input.dispatchEvent(new Event('change'));
        }
    });
};

// ============================
        //  GÉNÉRATION DE DOCUMENTS DOCX
        // ============================

        // Fonction pour convertir un nombre en toutes lettres en français
        const numberToWords = (num) => {
            if (num === 0) return "zéro";

            const units = ["", "un", "deux", "trois", "quatre", "cinq", "six", "sept", "huit", "neuf"];
            const teens = ["dix", "onze", "douze", "treize", "quatorze", "quinze", "seize", "dix-sept", "dix-huit", "dix-neuf"];
            const tens = ["", "dix", "vingt", "trente", "quarante", "cinquante", "soixante", "soixante-dix", "quatre-vingt", "quatre-vingt-dix"];
            
            const convert = (n) => {
                if (n < 10) return units[n];
                if (n < 20) return teens[n - 10];
                if (n < 100) {
                    const ten = Math.floor(n / 10);
                    const unit = n % 10;
                    if (ten === 7 || ten === 9) {
                         return tens[ten - 1] + (unit === 0 ? "" : "-") + teens[unit];
                    }
                    let result = tens[ten];
                    if (unit > 0) {
                        result += (unit === 1 && ten !== 8 ? " et " : "-") + units[unit];
                    }
                    if (ten === 8 && unit === 0) {
                        result += "s";
                    }
                    return result;
                }
                if (n < 1000) {
                    const hundred = Math.floor(n / 100);
                    const rest = n % 100;
                    let result = (hundred > 1 ? units[hundred] + " " : "") + "cent";
                    if (rest === 0 && hundred > 1) result += "s";
                    if (rest > 0) result += " " + convert(rest);
                    return result;
                }
                if (n < 1000000) {
                    const thousand = Math.floor(n / 1000);
                    const rest = n % 1000;
                    let result = (thousand > 1 ? convert(thousand) + " " : "") + "mille";
                    if (rest > 0) result += " " + convert(rest);
                    return result;
                }
                return "";
            };

            const integerPart = Math.floor(num);
            const decimalPart = Math.round((num - integerPart) * 100);

            let result = convert(integerPart) + " euros";
            if (decimalPart > 0) {
                result += " et " + convert(decimalPart) + " centimes";
            }
            return result.trim().replace(/\s+/g, ' ');
        };

                    paragraphLoop: true,

                });

                // 2. Préparer les données
                const osAmount = os.amount || (os.linkedQuoteDetails || []).reduce((sum, q) => sum + q.amount, 0);

                    'Titre de l’OS': os.label || os.description || '',

                    'Montant de l’OS écrit en toutes lettres y compris les centimes': numberToWords(osAmount)
                };

                // 3. Remplacer les placeholders
                doc.setData(data);
                doc.render();

                // 4. Générer le fichier et déclencher le téléchargement
                const out = doc.getZip().generate({
                    type: "blob",

            { id: 'moe', role: 'MAITRE D\'OEUVRE', nameRef: 'moe', isCompany: false },
            ...involvedLots.map(l => ({ 
                id: l.number, 
                role: `ENTREPRISE (Lot ${l.number})`, 
                name: l.company, 
                isCompany: true 
            }))
        ];

        listContainer.innerHTML = actors.map(actor => {
            const displayName = actor.isCompany ? actor.name : '(Saisie ci-dessus)';

            const checkDevis = actor.isCompany ? 'checked' : '';

                <td class="px-1 py-3 text-center border-l bg-yellow-50/30"><input type="checkbox" name="action_${actor.id}_devis" ${checkDevis} class="w-4 h-4 rounded border-gray-300 text-yellow-600 focus:ring-yellow-500"></td>
                <td class="px-1 py-3 text-center border-l bg-blue-50/30"><input type="checkbox" name="action_${actor.id}_info" ${checkInfo} class="w-4 h-4 rounded border-gray-300 text-blue-600 focus:ring-blue-500"></td>
                <td class="px-1 py-3 text-center border-l bg-green-50/30"><input type="checkbox" name="action_${actor.id}_exec" class="w-4 h-4 rounded border-gray-300 text-green-600 focus:ring-green-500"></td>
                <td class="px-1 py-3 text-center border-l bg-purple-50/30"><input type="checkbox" name="action_${actor.id}_avis" class="w-4 h-4 rounded border-gray-300 text-purple-600 focus:ring-purple-500"></td>
            </tr>
        `}).join('');

        // Action Générer
        document.getElementById('confirm-print-btn').addEventListener('click', () => {
            // A. Récupération Codification
            const codifData = {
                projet: document.getElementById('code-projet').value,
                emetteur: document.getElementById('code-emetteur').value,
                phase: document.getElementById('code-phase').value,
                lot: document.getElementById('code-lot').value,
                doc: document.getElementById('code-doc').value,
                zone: document.getElementById('code-zone').value,
                niveau: document.getElementById('code-niveau').value,
                id: document.getElementById('code-id').value,
                indice: document.getElementById('code-indice').value,
            };

            // Sauvegarde préférences Codif
            localStorage.setItem('codif_projet', codifData.projet);
            localStorage.setItem('codif_emetteur', codifData.emetteur);
            localStorage.setItem('codif_phase', codifData.phase);
            localStorage.setItem('codif_lot', codifData.lot);
            localStorage.setItem('codif_zone', codifData.zone);
            localStorage.setItem('codif_niveau', codifData.niveau);

            // B. Récupération Diffusion
            const finalMoaName = moaInput.value;
            const finalMoeName = moeInput.value;
            localStorage.setItem('last_moa_name', finalMoaName);
            localStorage.setItem('last_moe_name', finalMoeName);

            const actionsMap = {};
            actors.forEach(actor => {
                actionsMap[actor.id] = {
                    etudes: document.querySelector(`input[name="action_${actor.id}_etudes"]`).checked,
                    devis: document.querySelector(`input[name="action_${actor.id}_devis"]`).checked,
                    info: document.querySelector(`input[name="action_${actor.id}_info"]`).checked,
                    exec: document.querySelector(`input[name="action_${actor.id}_exec"]`).checked,
                    avis: document.querySelector(`input[name="action_${actor.id}_avis"]`).checked
                };
                if(actor.id === 'moa') actor.name = finalMoaName;
                if(actor.id === 'moe') actor.name = finalMoeName;
            });

            // C. Génération
            generateFtmPdf(ftm, actionsMap, actors, codifData); // On passe codifData en plus
            
            document.getElementById('print-config-modal').remove();
            document.body.classList.remove('modal-open');
        });

        document.getElementById('close-print-config').addEventListener('click', () => {
            document.getElementById('print-config-modal').remove();
            document.body.classList.remove('modal-open');
        });
    });
};


const renderPaymentCertificate = (lotId) => {
    const container = document.getElementById('financial-content-certificate');
    if (!container) return;

    // --- 1. RÉCUPÉRATION DES DONNÉES ---
    const lot = lots.find(l => l.id === lotId);
    
    // Vérification de sécurité pour les FTMs
    const availableFtms = (typeof ftms !== 'undefined') ? ftms : [];

    if (!lot || !lot.suiviFinancier || lot.suiviFinancier.length === 0) {
        container.innerHTML = `
            <div class="flex flex-col items-center justify-center p-12 bg-gray-50 rounded-xl border border-dashed border-gray-300">
                <div class="p-3 bg-gray-100 rounded-full mb-3"><i data-lucide="file-x" class="h-6 w-6 text-gray-400"></i></div>
                <p class="text-sm text-gray-500 font-medium">Aucune donnée de suivi mensuel disponible pour ce lot.</p>
            </div>`;
        lucide.createIcons();
        return;
    }

    // --- UTILS & FORMATS ---
    const TVA_RATE = 0.20;
    const formatCurrency = (val) => new Intl.NumberFormat('fr-FR', { style: 'currency', currency: 'EUR', minimumFractionDigits: 2 }).format(val || 0);
    const formatDate = (monthStr) => new Date(monthStr + '-02').toLocaleString('fr-FR', { month: 'long', year: 'numeric' }).replace(/^\w/, c => c.toUpperCase());
    const formatPercent = (val) => new Intl.NumberFormat('fr-FR', { style: 'percent', minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(val || 0);

    // --- SÉCURISATION DONNÉES ---
    if (typeof lot.montantMarche !== 'number') lot.montantMarche = 0;
    if (typeof lot.tauxRG !== 'number') lot.tauxRG = 0;
    if (typeof lot.montantCaution !== 'number') lot.montantCaution = 0;
    if (!Array.isArray(lot.penalites)) lot.penalites = [];
    if (!lot.avance) lot.avance = null;

    // --- 2. MODALE DE VÉRIFICATION ---
    const showVerificationModal = (monthFtms, monthLabel, onConfirm) => {
        const existingModal = document.getElementById('ftm-check-modal');
        if (existingModal) existingModal.remove();

        const hasFtms = monthFtms.length > 0;
        
        const modalHtml = `

                    <div class="bg-indigo-600 p-4 flex items-center gap-3">

                            <i data-lucide="file-check" class="h-6 w-6"></i>
                        </div>

                    </div>
                    
                    <div class="p-6">
                        <p class="text-sm text-gray-600 mb-4">
                            Avant de générer le certificat pour <strong>${monthLabel}</strong>, veuillez vérifier les Fiches de Travaux Modificatifs (FTM) incluses ce mois-ci.
                        </p>

                        <div class="bg-gray-50 rounded-lg border border-gray-200 p-4 mb-6 max-h-60 overflow-y-auto">
                            ${hasFtms ? `
                                <ul class="space-y-3">
                                    ${monthFtms.map(f => `
                                        <li class="flex items-start gap-3 text-sm">
                                            <i data-lucide="check-square" class="h-4 w-4 text-green-600 mt-0.5"></i>

                                                <div class="text-xs text-gray-500">Réalisé le : ${new Date(f.realisationDate).toLocaleDateString()}</div>
                                            </div>
                                        </li>
                                    `).join('')}
                                </ul>
                            ` : `
                                <div class="flex flex-col items-center justify-center py-4 text-gray-400">

                                </div>

                        <div class="flex justify-end gap-3">

                            </button>
                            <button id="btn-confirm-modal" class="px-4 py-2 text-sm font-medium text-white bg-indigo-600 rounded-lg hover:bg-indigo-700 shadow-md flex items-center gap-2">

                        </div>
                    </div>
                </div>
            </div>
        `;

        document.body.insertAdjacentHTML('beforeend', modalHtml);
        lucide.createIcons();

        document.getElementById('btn-cancel-modal').onclick = () => document.getElementById('ftm-check-modal').remove();
        document.getElementById('btn-confirm-modal').onclick = () => {
            document.getElementById('ftm-check-modal').remove();
            onConfirm();
        };
    };

    // --- 3. FONCTION D'IMPRESSION (CORRIGÉE : A4 & ALIGNEMENT) ---
    const printCertificate = (monthData, calculatedData, lotData, marketData) => {
        // --- 1. DONNÉES ---
        const marcheBase = lotData.montantMarche;
        const totalOS = marketData.totalOsAmount;
        const marcheTotal = marcheBase + totalOS;
        
        const cumulAnterieurHT = calculatedData.cumulActuelHT - calculatedData.travauxMoisHT;
        const pctAvancement = marcheTotal > 0 ? calculatedData.cumulActuelHT / marcheTotal : 0;
        
        // RG
        const rgMoisTTC = calculatedData.rgDuMoisTTC;
        const rgCumulTTC = calculatedData.rgARetenirActuel;
        
        // Identification & Nom du fichier
        const currentMonthIndex = lotData.suiviFinancier.findIndex(s => s.mois === monthData.mois);
        const situationNumber = monthData.situationNumero || (currentMonthIndex + 1);
        const companyNameSafe = (lotData.company || 'ENTREPRISE').replace(/[^a-zA-Z0-9-_]/g, '');
        const docTitle = `CP_${situationNumber}_${monthData.mois}_${companyNameSafe}`;
        
        // FTMs
        const ftmsDuMois = (typeof ftms !== 'undefined' ? ftms : []).filter(f => 
            (f.lots || []).includes(lotData.number) && 
            f.realisationDate && 
            f.realisationDate.startsWith(monthData.mois)
        );

        // Pénalités
        const penalitesDuMoisDetail = (lotData.penalites || []).filter(p => p.moisApplication === monthData.mois);
        const totalPenalitesHT = penalitesDuMoisDetail.reduce((sum, p) => sum + (p.montantHT || 0), 0);
        const remboursementAvanceHT = calculatedData.montantRemboursementMoisHT || 0;
        const totalSectionCHT = totalPenalitesHT - remboursementAvanceHT;

        // Calcul final
        const baseSoumiseTVA = calculatedData.travauxMoisHT + totalSectionCHT;
        const montantTVARecalculee = baseSoumiseTVA * TVA_RATE;
        const sousTotalTravauxTTC = baseSoumiseTVA + montantTVARecalculee;
        const netAPayerFinal = sousTotalTravauxTTC - rgMoisTTC;

        // Historique
        const historyData = lotData.suiviFinancier
            .filter((_, index) => index < currentMonthIndex)
            .slice(-5).reverse()
            .map(h => ({
                mois: h.mois,
                montantHT: h.frozenData ? h.frozenData.travauxMoisHT : h.validationMontantHT,
                montantTTC: h.frozenData ? h.frozenData.resteAPayerTTC : (h.validationMontantHT * (1 + TVA_RATE)),
                pctCumul: marcheTotal > 0 ? (h.frozenData ? h.frozenData.cumulActuelHT : h.cumulTravauxHT) / marcheTotal : 0
            }));

        const printWindow = window.open('', '_blank');
        
        const cssStyles = `
            <style>
                @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

                .doc-title h1 { margin: 0; font-size: 18pt; font-weight: 800; color: #0f172a; text-align: right; }
                .doc-subtitle { font-size: 10pt; color: #334155; text-align: right; margin-top: 5px; font-weight: 500; }

                /* Boxes */
                .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
                .box { background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 4px; padding: 10px; }
                .box-label { font-size: 7pt; text-transform: uppercase; color: #475569; font-weight: 700; letter-spacing: 0.5px; }
                .box-value { font-size: 10pt; font-weight: 600; color: #0f172a; margin-top: 2px; }
                
                /* --- TABLEAUX ET ALIGNEMENT --- */
                .section-header { font-size: 9pt; font-weight: 700; margin-bottom: 6px; display: flex; align-items: center; color: #0f172a; margin-top: 15px; }
                .section-header:first-of-type { margin-top: 0; }
                .badge { background: #0f172a; color: white; padding: 2px 6px; border-radius: 2px; font-size: 7pt; margin-right: 8px; }
                
                /* table-layout: fixed est essentiel pour que les largeurs de colonnes soient respectées */
                table { width: 100%; border-collapse: collapse; margin-bottom: 10px; table-layout: fixed; }
                
                th { 
                    text-align: right; font-size: 7.5pt; text-transform: uppercase;

                    border-bottom: 1px solid #cbd5e1;

                    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
                }
                th:first-child { text-align: left; }

                /* Backgrounds */
                .bg-highlight { background-color: #f1f5f9; font-weight: 700; }
                .bg-total { background-color: #f8fafc; font-weight: 700; border-top: 1px solid #cbd5e1; }

                /* Bottom Section */

                .history-panel { flex: 1; border: 1px solid #e2e8f0; border-radius: 4px; overflow: hidden; height: fit-content; }
                .history-head { background: #f1f5f9; padding: 8px; font-size: 8pt; font-weight: 700; text-transform: uppercase; color: #0f172a; border-bottom: 1px solid #e2e8f0; }
                
                .summary-panel { width: 45%; border: 2px solid #0f172a; border-radius: 4px; overflow: hidden; }

                <table>
                    <colgroup>
                        <col style="width: 40%;"> <col style="width: 15%;"> <col style="width: 15%;"> <col style="width: 15%;"> <col style="width: 15%;"> </colgroup>

                ${(totalSectionCHT !== 0) ? `

                <div class="bottom-layout">

                    <div class="summary-panel">

                        ${totalSectionCHT !== 0 ? `
                        <div class="sum-row">
                            <span>Pénalités/Retenues (C)</span>
                            <span class="sum-val">${formatCurrency(totalSectionCHT)}</span>

                        <div class="sum-row" style="background:#f8fafc; font-weight:600; font-size:8pt;">

                            <span class="sum-val">${formatCurrency(baseSoumiseTVA)}</span>

                        <div class="sum-row">

                        <div class="sum-row" style="background:#f1f5f9; font-weight:600;">

                            <span class="sum-val">${formatCurrency(sousTotalTravauxTTC)}</span>
                        </div>
                        <div class="sum-row">

                            <span style="font-size:9pt; font-weight:500; text-transform:uppercase;">NET À PAYER</span>
                            <span class="sum-val">${formatCurrency(netAPayerFinal)}</span>
                        </div>
                    </div>
                </div>

                <div class="signatures">

                    <div class="sig-box"><div class="sig-title">Maîtrise d'Ouvrage (Bon à Payer)</div></div>
                </div>
            </body>
            </html>
        `;

        printWindow.document.write(html);
        printWindow.document.close();
        printWindow.focus();
        setTimeout(() => printWindow.print(), 500);

const createFtmCard = (ftm) => {
    
    // --- LOGIQUE 'latestQuotes' (Inchangée) ---
    const quotesByBidders = (ftm.quotes || []).reduce((acc, quote) => {
        const bidderKey = (quote.workPackage ? (lots.find(l => l.number === quote.workPackage)?.company || quote.workPackage) : quote.externalCompany) || 'unknown';
        if (!acc[bidderKey]) acc[bidderKey] = [];
        acc[bidderKey].push(quote);
        return acc;
    }, {});

    const latestQuotesFromEachBidder = Object.values(quotesByBidders).map(bidderQuotes => {
        return bidderQuotes.reduce((latest, current) => (current.quoteIndex > latest.quoteIndex) ? current : latest);
    });

    // --- LOGIQUE DE MONTANT (Inchangée) ---
    let primaryAmount = 0;
    let primaryTitle = 'N/A';
    let primaryColor = 'text-gray-800';
    let icon = 'circle-dollar-sign';
    let customAmountHtml = null; 

    // --- Définition des états ---
    const moaAcceptedQuotes = latestQuotesFromEachBidder.filter(q => q.isAccepted === true);
    const moeSelectedQuotes = latestQuotesFromEachBidder.filter(q => q.isRejected !== true);
    const allProposedQuotes = latestQuotesFromEachBidder;

    // --- Logique de Concurrence ---
    const potentialBidders = new Set(ftm.lots); 
    (ftm.quotes || []).forEach(q => {
        if (q.externalCompany) potentialBidders.add(q.externalCompany); 
    });

    const respondingBidders = new Set();
    latestQuotesFromEachBidder.forEach(q => {
        if (q.workPackage) respondingBidders.add(q.workPackage);
        else if (q.externalCompany) respondingBidders.add(q.externalCompany);
    });

    const hasWinner = latestQuotesFromEachBidder.some(q => q.isRejected === false);
    const isCompetition = potentialBidders.size > 1;
    const allBiddersResponded = potentialBidders.size === respondingBidders.size;
    
    const unresolvedCompetition = isCompetition && (!allBiddersResponded || (allBiddersResponded && !hasWinner));

    // --- Calcul des montants (Logique inchangée) ---
    if (ftm.status === 'Annulé') {
        const totalMoaAmount = moaAcceptedQuotes.reduce((sum, q) => sum + (q.validatedMoaAmount || 0), 0);
        const totalMoeAmount = moeSelectedQuotes.reduce((sum, q) => sum + (q.validatedAmount || 0), 0);
        const totalProposedAmount = allProposedQuotes.reduce((sum, q) => sum + q.amount, 0);
        let lastKnownAmount = totalMoaAmount || totalMoeAmount || totalProposedAmount || ftm.moeEstimate;
        primaryAmount = lastKnownAmount;
        primaryTitle = 'Montant lors de l\'annulation';
        primaryColor = 'text-gray-400 line-through';
        icon = 'ban';

                    <span>Choix devis à faire</span>

    } else if (moeSelectedQuotes.length > 0 && moeSelectedQuotes.some(q => q.validatedAmount != null && q.validatedAmount !== 0)) {
        primaryAmount = moeSelectedQuotes.reduce((sum, q) => sum + (q.validatedAmount || 0), 0);
        primaryTitle = 'Montant validé MOE';
        primaryColor = primaryAmount >= 0 ? 'text-green-600' : 'text-red-600'; 
        icon = 'check-circle-2';
    } else if (moeSelectedQuotes.length > 0) {
        primaryAmount = moeSelectedQuotes.reduce((sum, q) => sum + (q.amount || 0), 0);
        primaryTitle = 'Montant proposé (en analyse MOE)';
        primaryColor = primaryAmount >= 0 ? 'text-blue-600' : 'text-red-600'; 
        icon = 'circle-dollar-sign'; 
    } else if (allProposedQuotes.length > 0) {
        primaryAmount = allProposedQuotes.reduce((sum, q) => sum + (q.amount || 0), 0);
        primaryTitle = 'Montant proposé ESE';
        primaryColor = primaryAmount >= 0 ? 'text-blue-600' : 'text-red-600'; 
        icon = 'circle-dollar-sign';
    } else if (ftm.moeEstimate > 0) {
        primaryAmount = ftm.moeEstimate;
        primaryTitle = 'Estimation initiale MOE';
        primaryColor = 'text-gray-500';
        icon = 'clipboard-list';

const calculateNotifications = () => {
    const alerts = [];
    const today = new Date();
    const msPerDay = 1000 * 60 * 60 * 24;

    // Helper : Différence en jours
    const diffDays = (d1, d2) => Math.ceil((new Date(d1) - new Date(d2)) / msPerDay);

    // --- 1. AUDIT FINANCIER (SITUATIONS) ---
    lots.filter(l => !l.isArchived).forEach(lot => {
        (lot.suiviFinancier || []).forEach(monthData => {
            // On utilise votre fonction existante getFinancialAlertStatus
            // (Assurez-vous que getFinancialAlertStatus est bien définie globalement comme vu précédemment)
            const status = getFinancialAlertStatus(monthData.mois, monthData.situationDate, monthData.validationDate, monthData.validationStatut);
            
            const monthLabel = new Date(monthData.mois + '-02').toLocaleString('fr-FR', { month: 'short', year: '2-digit' });

            if (status.type === 'late_validation') {
                alerts.push({
                    priority: 'high', // Rouge
                    type: 'finance',
                    title: `Validation en retard (${monthLabel})`,
                    message: `Lot ${lot.number} (${lot.company}) : Délai dépassé de ${status.label.replace('Retard Valid. ', '')}.`,
                    action: () => openFinancialTrackingModal(),
                    icon: 'alert-triangle'
                });
            } else if (status.type === 'pending_validation') {
                alerts.push({
                    priority: 'medium', // Orange
                    type: 'finance',
                    title: `Validation requise (${monthLabel})`,
                    message: `Lot ${lot.number} : Situation reçue, à valider.`,
                    action: () => openFinancialTrackingModal(),
                    icon: 'hourglass'
                });
            } else if (status.type === 'missing') {
                alerts.push({
                    priority: 'high',
                    type: 'finance',
                    title: `Situation manquante (${monthLabel})`,
                    message: `Lot ${lot.number} : Aucune situation reçue malgré la clôture de période.`,
                    action: () => openFinancialTrackingModal(),
                    icon: 'file-x'
                });
            } else if (status.type === 'late_submission') {
                alerts.push({
                    priority: 'medium',
                    type: 'finance',
                    title: `Retard envoi entreprise (${monthLabel})`,
                    message: `Lot ${lot.number} : La période est ouverte mais rien reçu.`,
                    action: () => openFinancialTrackingModal(),
                    icon: 'clock'
                });
            }
        });
    });

    // --- 2. AUDIT FTM (DÉLAIS & ANALYSE) ---
    ftms.forEach(ftm => {
        if (ftm.status === 'Annulé' || ftm.status === 'Devis validé MOA') return;

        // A. Retard Devis (Date limite dépassée)
        if (ftm.status === 'FTM transmise, en attente devis') {
            // On regarde les dates butoirs définies dans les impacts
            Object.entries(ftm.impacts || {}).forEach(([lotNumber, impact]) => {
                if (impact.expectedReturnDate) {
                    const delay = diffDays(today, impact.expectedReturnDate);
                    // On vérifie si CE lot a répondu (a un devis)
                    const hasReplied = (ftm.quotes || []).some(q => q.workPackage === lotNumber);
                    
                    if (!hasReplied && delay > 0) {
                        const lot = lots.find(l => l.number === lotNumber);
                        alerts.push({
                            priority: 'medium',
                            type: 'ftm',
                            title: `Devis en retard (${delay}j)`,
                            message: `FTM-${ftm.ftmNumber.split('FTM')[1]} : ${lot ? lot.company : 'Lot ' + lotNumber} n'a pas répondu.`,
                            action: () => openDetailsModal(ftm.id),
                            icon: 'mail-warning'
                        });
                    }
                }
            });
        }

        // B. Analyse MOE trop longue (> 7 jours)
        if (ftm.status.includes('analyse MOE')) {
            const statusDate = new Date(ftm.statusDate || ftm.date || today);
            const daysInStatus = diffDays(today, statusDate);
            if (daysInStatus > 7) {
                alerts.push({
                    priority: 'low', // Bleu
                    type: 'ftm',
                    title: `Analyse longue (+${daysInStatus}j)`,
                    message: `FTM-${ftm.ftmNumber.split('FTM')[1]} est en analyse depuis plus d'une semaine.`,
                    action: () => openDetailsModal(ftm.id),
                    icon: 'microscope'
                });
            }
        }
    });

    // --- 3. AUDIT OS (SIGNATURES) ---
    const allOs = [...standaloneOs, ...ftms.flatMap(f => f.os || [])];
    allOs.forEach(os => {
        const statusDetails = getOsStatusDetails(os);
        if (statusDetails.text === 'En signature') {
            const sentDate = new Date(os.sentToMoexDate);
            const daysPending = diffDays(today, sentDate);
            if (daysPending > 3) {
                alerts.push({
                    priority: 'medium',
                    type: 'os',
                    title: `Signature OS en attente`,
                    message: `OS ${os.number} en circulation depuis ${daysPending} jours.`,
                    action: () => { /* Idéalement ouvrir le modal OS, sinon Summary */ openSummaryModal(); },
                    icon: 'pen-tool'
                });
            }
        }
    });

    // TRIER LES ALERTES (High > Medium > Low)
    const priorityOrder = { 'high': 3, 'medium': 2, 'low': 1 };
    alerts.sort((a, b) => priorityOrder[b.priority] - priorityOrder[a.priority]);

    return alerts;
};

const renderNotifications = () => {
    const alerts = calculateNotifications();
    const container = document.getElementById('notification-list');
    const badge = document.getElementById('notification-badge');
    const countText = document.getElementById('notification-count-text');
    
    if (!container) return;

    // Mise à jour du badge
    if (alerts.length > 0) {
        badge.textContent = alerts.length > 9 ? '9+' : alerts.length;
        badge.classList.remove('hidden');
        // Animation "Pop"
        badge.classList.remove('scale-0');
        badge.classList.add('scale-100');
    } else {
        badge.classList.add('hidden');
    }
    countText.textContent = `${alerts.length} alerte(s) active(s)`;

    if (alerts.length === 0) {
        container.innerHTML = `
            <div class="flex flex-col items-center justify-center py-8 text-gray-400">
                <div class="bg-green-50 p-3 rounded-full mb-2">
                    <i data-lucide="check-check" class="h-6 w-6 text-green-500"></i>
                </div>
                <p class="text-sm font-medium text-gray-600">Tout est à jour !</p>
                <p class="text-xs">Aucune action requise pour le moment.</p>
            </div>
        `;
    } else {
        container.innerHTML = alerts.map((alert, index) => {
            // Styles selon priorité
            let styles = '';
            if (alert.priority === 'high') styles = 'bg-red-50 border-red-100 text-red-800 icon-red';
            else if (alert.priority === 'medium') styles = 'bg-amber-50 border-amber-100 text-amber-800 icon-amber';
            else styles = 'bg-blue-50 border-blue-100 text-blue-800 icon-blue';

            const iconColor = alert.priority === 'high' ? 'text-red-500' : (alert.priority === 'medium' ? 'text-amber-500' : 'text-blue-500');

            return `
                <div class="notification-item cursor-pointer p-3 rounded-lg border ${styles} hover:shadow-md transition-all relative group" data-index="${index}">
                    <div class="flex items-start gap-3">
                        <div class="flex-shrink-0 mt-0.5">
                            <i data-lucide="${alert.icon}" class="h-5 w-5 ${iconColor}"></i>
                        </div>
                        <div class="flex-grow min-w-0">
                            <h4 class="text-xs font-bold uppercase tracking-wide mb-0.5 flex justify-between">
                                ${alert.title}
                                <i data-lucide="chevron-right" class="h-3 w-3 opacity-0 group-hover:opacity-100 transition-opacity"></i>
                            </h4>
                            <p class="text-sm font-medium leading-snug truncate">${alert.message}</p>
                        </div>
                    </div>
                </div>
            `;
        }).join('');

        // Attacher les événements de clic
        container.querySelectorAll('.notification-item').forEach(item => {
            item.addEventListener('click', (e) => {
                const index = e.currentTarget.dataset.index;
                // Fermer le dropdown
                document.getElementById('notification-dropdown').classList.add('hidden');
                // Exécuter l'action
                alerts[index].action();
            });
        });
    }
    lucide.createIcons();
};

const initNotificationSystem = () => {
    const btn = document.getElementById('notification-btn');
    const dropdown = document.getElementById('notification-dropdown');
    const refreshBtn = document.getElementById('refresh-notifications-btn');

    if (btn && dropdown) {
        // Toggle Dropdown
        btn.addEventListener('click', (e) => {
            e.stopPropagation();
            dropdown.classList.toggle('hidden');
            if (!dropdown.classList.contains('hidden')) {
                renderNotifications(); // Refresh on open
            }
        });

        // Close on click outside
        document.addEventListener('click', (e) => {
            if (!btn.contains(e.target) && !dropdown.contains(e.target)) {
                dropdown.classList.add('hidden');
            }
        });

        // Refresh manual
        if(refreshBtn) {
            refreshBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                const icon = refreshBtn.querySelector('i');
                icon.classList.add('animate-spin');
                renderNotifications();
                setTimeout(() => icon.classList.remove('animate-spin'), 500);
            });
        }

        // Initial render
        renderNotifications();
    }
};

const openCreateOsModal = (ftmId) => {
					const ftm = ftms.find(f => f.id === ftmId);
					if (!ftm) return;

					openModal('os-create-modal-template', () => {
						const getLot = (lotNumber) => lots.find(l => l.number === lotNumber);
                        
                        // --- LOGIQUE DE DESTINATAIRE MISE À JOUR ---
						const latestQuotes = getLatestQuotes(ftm.quotes); // On filtre d'abord les indices
						const acceptedQuotes = latestQuotes.filter(q => q.isAccepted);
                        // 1. Trouver les destinataires déjà dans un OS (ex: "01.1")
						const existingRecipients = ftm.os.flatMap(os => (os.lots || []));
                        
                        // 2. Créer la liste des options disponibles
                        const availableOptions = [];
                        const addedRecipients = new Set(); // Pour éviter les doublons

						acceptedQuotes.forEach(q => {
                            // Le destinataire est soit le N° de lot, soit le nom de l'entreprise externe
                            const recipientValue = q.workPackage || q.externalCompany;
                            if (!recipientValue || existingRecipients.includes(recipientValue) || addedRecipients.has(recipientValue)) {
                                return; // Si pas de destinataire, ou s'il est déjà dans un OS, or s'il est déjà dans notre liste
                            }

                            addedRecipients.add(recipientValue);
                            let recipientLabel = '';

                            if (q.workPackage) {
                                // C'est un Lot
                                const lot = getLot(q.workPackage);
                                recipientLabel = lot ? `${lot.number} - ${lot.name} (${lot.company})` : `Lot ${q.workPackage}`;
                            } else {
                                // C'est un Intervenant Externe
                                recipientLabel = `Intervenant : ${q.externalCompany}`;
                            }
                            
                            availableOptions.push({ value: recipientValue, label: recipientLabel });
                        });
                        // --- FIN DE LA LOGIQUE ---


						const checkboxContainer = document.getElementById('lots-for-os-checkbox-container');
						if (availableOptions.length > 0) {
							checkboxContainer.innerHTML = availableOptions.map(opt => {
								return `

								</label>`;
							}).join('');
						} else {
							checkboxContainer.innerHTML = `<p class="text-sm text-gray-500 text-center">Aucun devis avec "Accord Paiement" n'est disponible pour un nouvel OS.</p>`;
						}
						
                        const osNumberInput = document.getElementById('os-create-number');
                        const osManualToggle = document.getElementById('os-manual-toggle');
                        const osErrorMsg = document.getElementById('os-create-error');

                        const generateAutoOsNumber = () => {
                            const year = new Date().getFullYear();
                            const osThisYear = [...ftms.flatMap(f => f.os), ...standaloneOs].filter(o => o.number.startsWith(`OS-${year}`));
                            const maxNum = osThisYear.length > 0 ? Math.max(...osThisYear.map(o => parseInt(o.number.split('-')[2], 10))) : 0;
                            const uniqueSuffix = Date.now().toString().slice(-4);
                            return `OS-${year}-${(maxNum + 1).toString().padStart(3, '0')}-${uniqueSuffix}`;
                        };
                        
                        osNumberInput.value = generateAutoOsNumber();

                        osManualToggle.addEventListener('change', () => {
                            osErrorMsg.textContent = ''; 
                            if (osManualToggle.checked) {
                                osNumberInput.readOnly = false;
                                osNumberInput.classList.remove('bg-gray-200');

            .filter(os => (os.lots || []).includes(lot.number))
            .reduce((sum, os) => sum + (os.amount || 0), 0);
        return acc;
    }, {});

    const financialData = filteredLots.map(lot => {
        const montantMarcheBase = lot.montantMarche || 0;
        
        const montantOS = isBaseOnly ? 0 : (osTotalsByLot[lot.number] || 0);
        const totalPenalitesLotHT = isBaseOnly ? 0 : (lot.penalties || []).reduce((sum, p) => sum + p.montantHT, 0);
        
        // --- CORRECTION : On utilise le Validé MOE au lieu des Factures pour la synthèse ---
        const montantValideCumulHT = (lot.suiviFinancier || []).reduce((sum, m) => sum + (m.validationMontantHT || 0), 0);
        
        // Calcul du remboursement d'avance (simulation simplifiée pour la synthèse)
        // Pour être précis, il faudrait utiliser calculateAdvanceRepayment(lot) ici,

        const montantRG_TTC_Retenue = Math.max(0, montantRG_TTC_Brut - montantCaution);

        return {

            montantOS, 
            nouveauMarche, 
            montantFactureBrut: montantValideCumulHT, // Renommé conceptuellement pour les totaux
            montantRG_TTC_Retenue, 
            montantPayeTTC, 
            resteDuTTC, 
            totalPenalitesLotHT 
        };
    });

    const totals = financialData.reduce((acc, data) => {

        acc.nouveauMarche += data.nouveauMarche;

        acc.montantPayeNet += data.montantPayeTTC;

const renderInvoicingProgressChart = (totals, totalNouveauMarcheTTC) => {

                    }
                },
                title: {

                    text: `${percentage.toFixed(1)}%`,
                    position: 'bottom',

                    color: '#1f2937',
                    padding: { top: -40 }
                }
            }
        }
    });
    financialCharts.push(chart);
};

    // Fonction utilitaire mise à jour pour respecter les certificats figés
    const calculateAdvanceRepayment = (lot) => {
        if (!lot.avance) return 0;
        
        let cumulRemboursement = 0;
        const monthlyData = lot.suiviFinancier || [];
        
        // Recalcul du marché corrigé (nécessaire pour les mois non figés)
        const allOs = [...standaloneOs, ...ftms.flatMap(ftm => ftm.os || [])];
        const osDuLot = allOs.filter(os => (os.lots || []).includes(lot.number));
        const totalOsAmount = osDuLot.reduce((sum, os) => sum + (os.amount || (os.linkedQuoteDetails||[]).reduce((s,q)=>s+q.amount,0)), 0);
        const totalPenalties = (lot.penalties || []).reduce((sum, p) => sum + p.montantHT, 0);
        const nouveauMarche = (lot.montantMarche || 0) + totalOsAmount + totalPenalties;

        let cumulTravaux = 0;

        // Tri chronologique
        const sortedMonths = monthlyData.sort((a, b) => a.mois.localeCompare(b.mois));
        
        sortedMonths.forEach(m => {
            // --- MODIFICATION ICI ---
            if (m.frozenData) {
                // Si le mois est figé, on prend la valeur historique EXACTE
                cumulRemboursement += m.frozenData.montantRemboursementMoisHT;
                // On met quand même à jour le cumul travaux pour les calculs futurs
                cumulTravaux += (m.frozenData.travauxMoisHT || 0);
            } else {
                // Sinon, on calcule dynamiquement
                const travauxMois = m.validationMontantHT || 0;
                cumulTravaux += travauxMois;
                
                const avancement = nouveauMarche > 0 ? (cumulTravaux / nouveauMarche) * 100 : 0;
                
                let startConditionMet = false;
                if (lot.avance.typeDebutRemboursement === 'mois') {
                    startConditionMet = m.mois >= lot.avance.valeurDebutRemboursement;
                } else {
                    startConditionMet = avancement >= lot.avance.valeurDebutRemboursement;
                }

                if (startConditionMet) {
                    const maxRemboursementPossible = lot.avance.montantCalculeHT - cumulRemboursement;
                    const remboursementCalcule = travauxMois * lot.avance.tauxRemboursement;
                    const remboursementMois = Math.max(0, Math.min(maxRemboursementPossible, remboursementCalcule));
                    cumulRemboursement += remboursementMois;
                }
            }
        });
        return cumulRemboursement;
    };

const renderMonthlyComparisonChart = (monthlyData) => {
    const ctx = document.getElementById('monthly-comparison-chart')?.getContext('2d');
    if (!ctx) return;

    const sortedMonths = Object.keys(monthlyData).sort();
    const labels = sortedMonths.map(m => new Date(m + '-02').toLocaleString('fr-FR', { month: 'short', year: '2-digit' }));
    const previsionnelData = sortedMonths.map(m => monthlyData[m].previsionnel);
    // --- MODIFIÉ : Ajout situation et validation ---
    const situationHTData = sortedMonths.map(m => monthlyData[m].situationMontantHT || 0);
    const validationHTData = sortedMonths.map(m => monthlyData[m].validationMontantHT || 0);


    const chart = new Chart(ctx, {
        type: 'bar',
        data: {
            labels: labels,
            datasets: [
                {
                    label: 'Prévisionnel MOE',
                    data: previsionnelData,
                    backgroundColor: 'rgba(209, 213, 219, 0.5)', // gray-300
                    borderColor: 'rgba(107, 114, 128, 1)', // gray-500
                    borderWidth: 1,
                },
                {
                    label: 'Situation ESE HT',
                    data: situationHTData,
                    backgroundColor: 'rgba(147, 197, 253, 0.7)', // blue-300
                    borderColor: 'rgba(59, 130, 246, 1)', // blue-500
                    borderWidth: 1,
                },
                {
                    label: 'Validé MOE HT',
                    data: validationHTData,
                    backgroundColor: 'rgba(99, 102, 241, 0.7)', // indigo-500
                    borderColor: 'rgba(79, 70, 229, 1)', // indigo-600
                    borderWidth: 1,
                }
            ]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                title: { display: true, text: 'Suivi Mensuel : Prévi. vs Situation vs Validé' },
                tooltip: { callbacks: { label: (c) => `${c.dataset.label}: ${c.raw.toLocaleString('fr-FR')} €` } }
            },
            scales: { y: { beginAtZero: true, ticks: { callback: (v) => `${(v/1000)}k €` } } }
        }
    });
    financialCharts.push(chart);
};

const openFinancialTrackingModal = () => {
    openModal('financial-tracking-modal-template', () => {
        const lotSelect = document.getElementById('financial-lot-select');
        const addMonthBtn = document.getElementById('add-specific-month-btn');

        const tabsContainer = document.getElementById('financial-tabs-container');
        const monthlyViewContent = document.getElementById('financial-content-monthly');
        const penaltiesViewContent = document.getElementById('financial-content-penalties');
        const certificateViewContent = document.getElementById('financial-content-certificate');
        const monthlyViewTab = document.getElementById('tab-monthly-view');
        const penaltiesViewTab = document.getElementById('tab-penalties-view');
        const certificateViewTab = document.getElementById('tab-certificate-view');

        const switchTab = (activeTab) => {
            if (activeTab === 'penalties') {
                monthlyViewTab.classList.remove('active');
                certificateViewTab.classList.remove('active');
                penaltiesViewTab.classList.add('active');
                monthlyViewContent.classList.add('hidden');
                certificateViewContent.classList.add('hidden');
                penaltiesViewContent.classList.remove('hidden');
                renderPenaltiesTab(lotSelect.value);
            } else if (activeTab === 'certificate') {
                monthlyViewTab.classList.remove('active');
                penaltiesViewTab.classList.remove('active');
                certificateViewTab.classList.add('active');
                monthlyViewContent.classList.add('hidden');
                penaltiesViewContent.classList.add('hidden');
                certificateViewContent.classList.remove('hidden');
                renderPaymentCertificate(lotSelect.value);
            } else { // 'monthly'
                penaltiesViewTab.classList.remove('active');
                certificateViewTab.classList.remove('active');
                monthlyViewTab.classList.add('active');
                penaltiesViewContent.classList.add('hidden');
                certificateViewContent.classList.add('hidden');
                monthlyViewContent.classList.remove('hidden');
            }
        };
        
        monthlyViewTab.addEventListener('click', () => switchTab('monthly'));
        penaltiesViewTab.addEventListener('click', () => switchTab('penalties'));
        certificateViewTab.addEventListener('click', () => switchTab('certificate'));


        lotSelect.innerHTML = `
            <option value="all" class="font-bold text-indigo-600">Vue Globale (Tous les lots)</option>
            ${lots.filter(l => !l.isArchived).map(lot => 
                `<option value="${lot.id}">${lot.number} - ${lot.company}</option>`
            ).join('')}
        `;
        
        lotSelect.addEventListener('change', (e) => {
            const selectedValue = e.target.value;
            if (selectedValue === 'all') {
                penaltiesViewTab.classList.add('hidden');
                certificateViewTab.classList.add('hidden');
                switchTab('monthly');
                renderFinancialViewForAllLots();
            } else if (selectedValue) {
                penaltiesViewTab.classList.remove('hidden');
                certificateViewTab.classList.remove('hidden');
                switchTab('monthly'); // Default to monthly view
                renderFinancialViewForLot(selectedValue);
            }
        });
        
        addMonthBtn.addEventListener('click', () => {
            const lotId = lotSelect.value;
            const newMonthValue = document.getElementById('new-month-input').value;

            if (lotId === 'all' || !lotId) {
                alert("Veuillez sélectionner un lot spécifique pour ajouter un mois.");
                return;
            }
            if (!newMonthValue) {
                alert("Veuillez choisir un mois à ajouter.");
                return;
            }

            const lot = lots.find(l => l.id === lotId);
            if (!lot) return;

            if (!lot.suiviFinancier) lot.suiviFinancier = [];

            const monthExists = lot.suiviFinancier.some(item => item.mois === newMonthValue);
            if (monthExists) {
                alert("Ce mois existe déjà pour ce lot.");
                return;
            }

            // ================================================================
            // --- CORRECTION : Création de l'objet mensuel complet ---
            // ================================================================
            // Au lieu de créer un objet partiel, nous créons l'objet complet
            // avec toutes les clés de workflow initialisées.
            const newMonthData = {
                mois: newMonthValue,
                previsionnel: 0,
                factures: [],
                situationNumero: '',
                situationDate: null,
                situationMontantHT: 0,
                validationStatut: 'Attente MOE', // Statut par défaut
                validationMontantHT: 0,
                validationDate: null
            };
            
            lot.suiviFinancier.push(newMonthData);
            // ================================================================
            // --- FIN DE LA CORRECTION ---
            // ================================================================

            // Sauvegarde immédiate et rafraîchissement
			
			saveLot(lot).then(() => {
                renderFinancialViewForLot(lotId);
            });
        });

		// --- LOGIQUE MISE À JOUR ---
		const penaltyForm = document.getElementById('penalty-form');
		const penaltyAppSelect = document.getElementById('penalty-application');
		const penaltyMonthWrapper = document.getElementById('penalty-month-wrapper');

		// Affiche/cache le champ mois selon la sélection
		penaltyAppSelect.addEventListener('change', (e) => {
			if (e.target.value === 'prochaine_facture') {
				penaltyMonthWrapper.classList.remove('hidden');
			} else {
				penaltyMonthWrapper.classList.add('hidden');
			}
		});
		// Déclenche au cas où le formulaire est pré-rempli
		penaltyAppSelect.dispatchEvent(new Event('change'));

        penaltyForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const lotId = lotSelect.value;
            if (!lotId || lotId === 'all') return;
            
            const lot = lots.find(l => l.id === lotId);
            const penaltyId = document.getElementById('penalty-id').value;
			const applicationType = document.getElementById('penalty-application').value;
			const moisApplication = document.getElementById('penalty-month').value;

			if (applicationType === 'prochaine_facture' && !moisApplication) {
				alert("Veuillez sélectionner un mois d'application pour cette pénalité.");
				return;
			}


			// 1. On récupère la valeur brute saisie
			const rawAmount = safeParseFloat(document.getElementById('penalty-montantHT').value);

			// 2. SÉCURITÉ : On force le signe négatif
			// Si l'utilisateur a mis "500", on le transforme en "-500".
			// S'il a déjà mis "-500", on le laisse tel quel.
			const secureAmount = rawAmount > 0 ? -rawAmount : rawAmount;

			const penaltyData = {
				id: penaltyId || `pen-${Date.now()}`,
				identifiant: document.getElementById('penalty-identifiant').value,
				libelle: document.getElementById('penalty-libelle').value,
				refContractuelle: document.getElementById('penalty-refContractuelle').value,
				montantHT: secureAmount, // <--- On utilise la valeur sécurisée
				application: applicationType,
				moisApplication: applicationType === 'prochaine_facture' ? moisApplication : null
			};

            
            if (isNaN(penaltyData.montantHT)) {
                alert("Le montant de la pénalité doit être un nombre.");
                return;
            }

            if (penaltyId) {
                lot.penalites = lot.penalites.map(p => p.id === penaltyId ? penaltyData : p);
            } else {
                lot.penalites.push(penaltyData);
            }


			saveLot(lot).then(() => {
                resetPenaltyForm();
                renderPenaltiesTab(lotId);
                renderFinancialViewForLot(lotId);
            });

            
        });
        // --- FIN DE LA LOGIQUE MISE À JOUR ---
        
        document.getElementById('cancel-penalty-edit-btn').addEventListener('click', resetPenaltyForm);
        
        // Les deux boutons de fermeture appellent la même fonction
        document.getElementById('close-financial-modal-btn').addEventListener('click', closeModal);
        document.getElementById('close-financial-modal-btn-footer').addEventListener('click', closeModal);

        // Affichage initial (Vue Globale)
        penaltiesViewTab.classList.add('hidden');
        certificateViewTab.classList.add('hidden');
        renderFinancialViewForAllLots();
    });
};


const updateChartsAndTotalsFromTable = () => {
    financialCharts.forEach(chart => chart.destroy());
    financialCharts = [];

    // --- NOUVELLE FONCTION HELPER ---
    // Fonction interne pour lire correctement les nombres français (avec virgule)
    const parseFloatFrench = (valueStr) => {
        if (!valueStr) return 0;
        // Remplace la virgule par un point avant de convertir
        return parseFloat(valueStr.replace(',', '.')) || 0;
    };
    // --- FIN HELPER ---

    const monthlyDataForChart = {};
    const tableRows = document.querySelectorAll('#financial-table tbody tr.financial-row');
    const nouveauMontantMarche = parseFloat(document.getElementById('nouveau-marche-val').dataset.value) || 0;
    
    tableRows.forEach(row => {
        const mois = row.dataset.month;
        if (!mois) return;

        // --- CORRECTION APPLIQUÉE ---
        // Nous utilisons notre nouvelle fonction "parseFloatFrench" pour lire les valeurs
        const previsionnel = parseFloatFrench(row.querySelector('input.previsionnel-input').value);
        const situationMontantHT = parseFloatFrench(row.querySelector('input.situation-montant-input').value);
        const validationMontantHT = parseFloatFrench(row.querySelector('input.validation-montant-input').value);
        // --- FIN CORRECTION ---

        monthlyDataForChart[mois] = {
            previsionnel: previsionnel,
            situationMontantHT: situationMontantHT,
            validationMontantHT: validationMontantHT,
            factureBrut: 0, // factureBrut n'est plus dans ce tableau, mais les graphiques s'attendent à 0
            rg: 0
        };
    });
    
    const lotId = document.getElementById('financial-lot-select').value;
    const lot = lots.find(l => l.id === lotId);
    
    const allOs = [...standaloneOs, ...ftms.flatMap(ftm => ftm.os || [])];
    const osDuLot = lot ? allOs.filter(os => (os.lots || []).includes(lot.number)) : [];
    const undatedOs = osDuLot.filter(os => !os.sentToMoexDate && !(os.signatureChain || []).some(s => s.date));
    const undatedOsAmount = undatedOs.reduce((sum, os) => {
        let amount = os.amount ?? (os.linkedQuoteDetails || []).reduce((qSum, q) => qSum + (q.amount || 0), 0);
        return sum + amount;
    }, 0);

    const plottableBudget = nouveauMontantMarche - undatedOsAmount;

    // On passe le nouvel objet de données complet aux fonctions de rendu des graphiques
    renderMonthlyComparisonChart(monthlyDataForChart);
    renderCumulativeProgressChart(monthlyDataForChart, plottableBudget);
};
